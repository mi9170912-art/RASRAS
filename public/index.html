<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام مسار الطلبات - رصرص للتوكيلات التجارية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --ink: #1c2530;
    --paper: #f0f2f5;
    --panel: #ffffff;
    --line: #dde2e8;
    --amber: #c08a2e;
    --teal: #2b7a6c;
    --slate: #5b6b81;
    --slate-bg: #eaeef3;
    --red: #b23b3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Cairo', sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  .app { max-width: 800px; margin: 0 auto; padding: 14px 14px 80px; }
  
  /* Login Box */
  .login-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    max-width: 400px;
    margin: 60px auto 0;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    text-align: center;
  }
  .login-card h2 { margin-bottom: 6px; font-size: 20px; }
  .login-card p { font-size: 12px; color: var(--slate); margin-bottom: 20px; }

  /* Navigation & Layout */
  .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px 16px; }
  .brand h1 { font-size: 17px; margin: 0; font-weight: 800; }
  .brand p { font-size: 11px; margin: 1px 0 0; color: var(--slate); }
  .user-badge { font-size: 12px; font-weight: 700; background: var(--slate-bg); padding: 6px 12px; border-radius: 20px; }
  .logout-btn { background: none; border: none; color: var(--red); font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; margin-inline-start: 8px; }

  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
  .tab {
    background: none; border: none; font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--slate); padding: 8px 10px; cursor: pointer; white-space: nowrap; position: relative;
  }
  .tab.active { color: var(--ink); font-weight: 800; }
  .tab.active::after { content: ''; position: absolute; bottom: -11px; left: 0; right: 0; height: 3px; background: var(--ink); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .stat-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; }
  .stat-card b { display: block; font-size: 20px; }
  .stat-card span { font-size: 11px; color: var(--slate); }

  .order-item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
  .order-top { display: flex; justify-content: space-between; align-items: flex-start; }
  
  label { display: block; font-size: 12.5px; font-weight: 700; color: var(--slate); margin: 10px 0 4px; }
  input[type=text], input[type=password], input[type=tel], input[type=number], select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    font-family: inherit; font-size: 13.5px; background: #fbfbfc;
  }
  .btn-primary { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--ink); color: #fff; font-family: inherit; font-weight: 700; cursor: pointer; margin-top: 14px; }
  .btn-secondary { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-family: inherit; font-weight: 700; cursor: pointer; margin-top: 8px; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .toast.show { opacity: 1; }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { position: absolute; left: 0; top: 0; width: 100%; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
// --- 1. الإعدادات وقاعدة البيانات الدائمة ---
const SUPABASE_URL = "https://YOUR_SUPABASE_URL.supabase.co"; 
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY"; 

let supabaseClient = null;
if (SUPABASE_URL && SUPABASE_KEY && window.supabase) {
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

// قائمة الحسابات (اليوزر والباسورد) لكل قسم
const USERS = {
  "sales":     { pass: "1234", name: "د. أحمد (المبيعات)", role: "sales" },
  "logistics": { pass: "1234", name: "قسم النقل",          role: "logistics" },
  "accounts":  { pass: "1234", name: "قسم الحسابات",       role: "accounts" },
  "warehouse": { pass: "1234", name: "إدارة المخازن",      role: "warehouse" },
  "driver":    { pass: "1234", name: "قسم التوصيل",        role: "driver" }
};

let DATA = { orders: [], customers: [], suppliers: [] };
let currentUser = null;
let currentView = 'dashboard';
let selectedOrderId = null;

async function loadDataFromSupabase() {
  if (supabaseClient) {
    try {
      let { data, error } = await supabaseClient.from('app_data').select('*').eq('id', 1).single();
      if (data && data.content) DATA = data.content;
    } catch(e) { console.error("خطأ في جلب البيانات الدائمة:", e); }
  } else {
    const local = localStorage.getItem('RASRAS_PERMANENT_DATA');
    if (local) DATA = JSON.parse(local);
  }
  render();
}

async function savePermanentData() {
  if (supabaseClient) {
    try {
      await supabaseClient.from('app_data').upsert({ id: 1, content: DATA });
    } catch(e) { showToast("تعذر الحفظ في السيرفر السحابي"); }
  }
  localStorage.setItem('RASRAS_PERMANENT_DATA', JSON.stringify(DATA));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// --- 2. إدارة الواجهات والعمليات ---
function render() {
  const app = document.getElementById('app');
  if (!currentUser) {
    app.innerHTML = loginHTML();
    bindLoginEvents();
    return;
  }
  app.innerHTML = headerHTML() + tabsHTML() + mainViewHTML();
  bindAppEvents();
}

function loginHTML() {
  return `
  <div class="login-card">
    <h2>رصرص للتوكيلات التجارية</h2>
    <p>تسجيل الدخول للنظام السحابي</p>
    <label>اسم المستخدم</label>
    <select id="loginUser">
      <option value="sales">sales (المبيعات)</option>
      <option value="logistics">logistics (النقل)</option>
      <option value="accounts">accounts (الحسابات)</option>
      <option value="warehouse">warehouse (المخازن)</option>
      <option value="driver">driver (السائق)</option>
    </select>
    <label>كلمة السر</label>
    <input type="password" id="loginPass" placeholder="••••">
    <button class="btn-primary" id="loginBtn">دخول للنظام</button>
  </div>`;
}

function headerHTML() {
  return `
  <div class="header">
    <div class="brand">
      <h1>رصرص للتوكيلات التجارية</h1>
      <p>نظام مسار الطلبات والسجلات الدائمة</p>
    </div>
    <div>
      <span class="user-badge">${currentUser.name}</span>
      <button class="logout-btn" id="logoutBtn">خروج</button>
    </div>
  </div>`;
}

function tabsHTML() {
  return `
  <div class="tabs">
    <button class="tab ${currentView==='dashboard'?'active':''}" data-v="dashboard">الرئيسية</button>
    ${currentUser.role==='sales'? `<button class="tab ${currentView==='new_order'?'active':''}" data-v="new_order">+ أمر جديد</button>` : ''}
    <button class="tab ${currentView==='reports'?'active':''}" data-v="reports">التقارير المالية</button>
    <button class="tab ${currentView==='partners'?'active':''}" data-v="partners">سجل العملاء</button>
  </div>`;
}

function mainViewHTML() {
  if (currentView === 'dashboard') {
    return `
    <div class="stat-grid">
      <div class="stat-card"><b>${DATA.orders.length}</b><span>إجمالي الأوامر</span></div>
      <div class="stat-card"><b>${DATA.orders.filter(o=>o.stage!=='delivered').length}</b><span>قيد التنفيذ</span></div>
      <div class="stat-card"><b>${DATA.orders.filter(o=>o.stage==='delivered').length}</b><span>المكتملة</span></div>
    </div>
    ${DATA.orders.map(o => `
      <div class="order-item" onclick="openOrder('${o.id}')">
        <div class="order-top">
          <div><b>${o.id}</b> - ${o.partyName}</div>
          <small>${o.stage}</small>
        </div>
      </div>
    `).join('')}`;
  }

  if (currentView === 'reports') {
    const totalSales = DATA.orders.filter(o=>o.stage==='delivered').reduce((s, o)=> s + (Number(o.finalTotal)||0), 0);
    return `
    <div class="card">
      <h3>تقارير الأداء والمبيعات الدائمة</h3>
      <p>إجمالي المبيعات المحصلة والمسلمة: <b>${totalSales.toLocaleString('ar-EG')} ج.م</b></p>
      <button class="btn-secondary" onclick="window.print()">طباعة التقرير العام</button>
    </div>`;
  }

  if (currentView === 'partners') {
    return `
    <div class="card">
      <h3>سجل العملاء والموردين المسجل دائمًا</h3>
      ${(DATA.customers||[]).map(c => `<p>• <b>${c.name}</b> (${c.phone})</p>`).join('')}
    </div>`;
  }

  return '';
}

function bindLoginEvents() {
  document.getElementById('loginBtn').onclick = () => {
    const uKey = document.getElementById('loginUser').value;
    const pass = document.getElementById('loginPass').value;
    if (USERS[uKey] && USERS[uKey].pass === pass) {
      currentUser = USERS[uKey];
      render();
    } else {
      showToast("كلمة السر غير صحيحة");
    }
  };
}

function bindAppEvents() {
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) logoutBtn.onclick = () => { currentUser = null; render(); };

  document.querySelectorAll('.tab').forEach(el => {
    el.onclick = () => { currentView = el.dataset.v; render(); };
  });
}

function openOrder(id) {
  selectedOrderId = id;
  showToast("فتح طلب رقم: " + id);
}

loadDataFromSupabase();
</script>
</body>
</html>
