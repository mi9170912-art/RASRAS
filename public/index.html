<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RASRAS ERP | نظام إدارة أوامر البيع</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --green:#0b8f4d;
  --green-dark:#056b39;
  --green-light:#eaf8f0;
  --green-soft:#f3fbf6;
  --navy:#10231b;
  --ink:#17221d;
  --muted:#718078;
  --bg:#f4f7f5;
  --white:#fff;
  --line:#e1e9e4;
  --danger:#dc3545;
  --warning:#d98b00;
  --blue:#1479c9;
  --purple:#7654c5;
  --shadow:0 8px 30px rgba(20,50,35,.07);
  --shadow2:0 15px 45px rgba(20,50,35,.12);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:'Cairo',sans-serif;
  background:
    radial-gradient(circle at 10% 0%,rgba(11,143,77,.07),transparent 28%),
    var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

button,input,select,textarea{
  font-family:inherit;
}

button{cursor:pointer}

.app{
  max-width:1180px;
  margin:auto;
  padding:18px 18px 80px;
}

/* =========================
   LOGIN
========================= */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.login-card{
  width:100%;
  max-width:460px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:30px;
  padding:38px 32px;
  box-shadow:var(--shadow2);
  text-align:center;
}

.login-logo{
  width:110px;
  height:110px;
  object-fit:contain;
  margin-bottom:8px;
}

.login-card h1{
  margin:4px 0 0;
  font-size:26px;
  font-weight:900;
  color:var(--navy);
}

.login-card .subtitle{
  margin:4px 0 28px;
  color:var(--green);
  font-size:13px;
  font-weight:800;
}

.login-footer{
  color:var(--muted);
  font-size:11px;
  margin-top:20px;
}

/* =========================
   HEADER
========================= */

.header{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  box-shadow:var(--shadow);
  margin-bottom:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.brand-logo{
  width:58px;
  height:58px;
  object-fit:contain;
  border-radius:14px;
}

.brand h1{
  margin:0;
  font-size:21px;
  font-weight:900;
  color:var(--navy);
}

.brand p{
  margin:0;
  font-size:11px;
  color:var(--green);
  font-weight:800;
}

.user-area{
  display:flex;
  align-items:center;
  gap:8px;
}

.user-badge{
  background:var(--green-light);
  border:1px solid #c9ecd8;
  color:var(--green-dark);
  border-radius:30px;
  padding:7px 13px;
  font-size:12px;
  font-weight:800;
}

.logout-btn{
  background:#fff1f2;
  color:var(--danger);
  border:1px solid #ffd5da;
  border-radius:12px;
  padding:8px 13px;
  font-size:12px;
  font-weight:800;
}

/* =========================
   NAV
========================= */

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 1px 10px;
  margin-bottom:8px;
}

.tab{
  flex:0 0 auto;
  background:#fff;
  border:1px solid var(--line);
  color:var(--muted);
  border-radius:13px;
  padding:10px 15px;
  font-size:12px;
  font-weight:800;
  transition:.2s;
}

.tab:hover{
  border-color:#b8dcca;
  color:var(--green);
}

.tab.active{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
  box-shadow:0 5px 15px rgba(11,143,77,.2);
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:20px;
  height:20px;
  border-radius:20px;
  background:#ef4444;
  color:#fff;
  font-size:10px;
  margin-right:4px;
}

/* =========================
   CARDS
========================= */

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:21px;
  margin-bottom:15px;
  box-shadow:var(--shadow);
}

.card-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}

.card-title h2,
.card-title h3{
  margin:0;
  color:var(--navy);
  font-weight:900;
}

.card-title h2{font-size:18px}
.card-title h3{font-size:15px}

.card-title p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:11px;
}

/* =========================
   STATS
========================= */

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:15px;
}

.stat{
  position:relative;
  overflow:hidden;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:17px;
  box-shadow:var(--shadow);
}

.stat:after{
  content:"";
  position:absolute;
  left:-20px;
  bottom:-25px;
  width:80px;
  height:80px;
  background:var(--green-light);
  border-radius:50%;
}

.stat-icon{
  width:37px;
  height:37px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--green-light);
  color:var(--green);
  font-size:18px;
  margin-bottom:10px;
}

.stat b{
  display:block;
  font-size:24px;
  font-weight:900;
  color:var(--navy);
}

.stat span{
  font-size:11px;
  color:var(--muted);
  font-weight:700;
}

/* =========================
   FORMS
========================= */

label{
  display:block;
  margin:14px 0 6px;
  font-size:12px;
  font-weight:800;
  color:var(--navy);
}

label:first-child{
  margin-top:0;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fbfdfc;
  color:var(--ink);
  outline:none;
  padding:11px 13px;
  font-size:13px;
  transition:.2s;
}

textarea{
  resize:vertical;
  min-height:90px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(11,143,77,.08);
  background:#fff;
}

.row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.row3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

/* =========================
   BUTTONS
========================= */

.btn-primary,
.btn-secondary,
.btn-danger,
.btn-warning,
.btn-blue{
  border-radius:12px;
  padding:12px 16px;
  border:none;
  font-size:13px;
  font-weight:800;
  transition:.2s;
}

.btn-primary{
  width:100%;
  margin-top:15px;
  background:var(--green);
  color:#fff;
  box-shadow:0 5px 16px rgba(11,143,77,.2);
}

.btn-primary:hover{
  background:var(--green-dark);
  transform:translateY(-1px);
}

.btn-secondary{
  background:#fff;
  border:1px solid var(--line);
  color:var(--ink);
}

.btn-danger{
  background:#fff1f2;
  color:var(--danger);
  border:1px solid #ffd5da;
}

.btn-warning{
  background:#fff7df;
  color:#a56800;
  border:1px solid #f5dda1;
}

.btn-blue{
  background:#edf7ff;
  color:#0966aa;
  border:1px solid #cfe9fc;
}

/* =========================
   SEGMENT
========================= */

.seg{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.seg-btn{
  flex:1;
  border:1px solid var(--line);
  background:#fff;
  border-radius:13px;
  padding:12px;
  font-size:13px;
  font-weight:900;
  color:var(--muted);
}

.seg-btn.active{
  background:var(--navy);
  border-color:var(--navy);
  color:#fff;
}

/* =========================
   ORDERS
========================= */

.order-item{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:16px;
  margin-bottom:9px;
  cursor:pointer;
  transition:.2s;
}

.order-item:hover{
  border-color:#b9ddca;
  box-shadow:0 6px 20px rgba(0,0,0,.06);
  transform:translateY(-1px);
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.order-id{
  font-size:11px;
  color:var(--muted);
  font-weight:800;
}

.order-name{
  font-size:15px;
  font-weight:900;
  color:var(--navy);
  margin-top:3px;
}

.order-meta{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

.order-meta b{
  color:var(--green-dark);
}

.pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:6px 11px;
  border-radius:30px;
  white-space:nowrap;
  font-size:10px;
  font-weight:900;
}

.stage-sales_created{
  background:#f1f5f9;
  color:#64748b;
}

.stage-manager_approval{
  background:#f3e8ff;
  color:#7e22ce;
}

.stage-logistics_review{
  background:#fff7df;
  color:#a56800;
}

.stage-accounts_approval{
  background:#e8f5ff;
  color:#0966aa;
}

.stage-warehouse_release{
  background:#fff0f6;
  color:#be185d;
}

.stage-with_driver{
  background:#fff9db;
  color:#9a6900;
}

.stage-delivered{
  background:var(--green-light);
  color:var(--green-dark);
}

.stage-tax_pending{
  background:#fff1f2;
  color:#c02638;
}

.stage-completed{
  background:var(--green-light);
  color:var(--green-dark);
}

/* =========================
   ITEMS
========================= */

.item-header{
  display:grid;
  grid-template-columns:1fr 100px 110px 38px;
  gap:8px;
  padding:0 2px 6px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}

.item-row{
  display:grid;
  grid-template-columns:1fr 100px 110px 38px;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}

.item-row input{
  padding:9px 10px;
}

.rm-btn{
  width:38px;
  height:38px;
  border-radius:11px;
  border:1px solid #ffd5da;
  background:#fff1f2;
  color:var(--danger);
  font-size:19px;
  font-weight:700;
}

.add-item{
  width:100%;
  padding:11px;
  margin-top:5px;
  border:1px dashed #b9dcca;
  background:var(--green-soft);
  color:var(--green);
  border-radius:12px;
  font-size:12px;
  font-weight:900;
}

.total-box{
  margin-top:15px;
  padding-top:14px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.total-box span{
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}

.total-box b{
  color:var(--green-dark);
  font-size:20px;
}

/* =========================
   ALERT
========================= */

.alert{
  border-radius:15px;
  padding:13px 15px;
  margin-bottom:14px;
  font-size:12px;
  font-weight:700;
}

.alert-green{
  background:var(--green-light);
  color:var(--green-dark);
  border:1px solid #c9ecd8;
}

.alert-yellow{
  background:#fff8e5;
  color:#9a6900;
  border:1px solid #f2dda7;
}

.alert-red{
  background:#fff1f2;
  color:#b42333;
  border:1px solid #ffd1d7;
}

.alert-blue{
  background:#eef7ff;
  color:#0966aa;
  border:1px solid #cde7fa;
}

/* =========================
   APPROVAL FLOW
========================= */

.flow{
  display:flex;
  align-items:center;
  overflow:auto;
  padding:5px 0 15px;
  margin-bottom:5px;
}

.flow-step{
  min-width:125px;
  text-align:center;
  position:relative;
}

.flow-step:not(:last-child):after{
  content:"";
  position:absolute;
  top:18px;
  right:-50%;
  width:100%;
  height:2px;
  background:var(--line);
  z-index:0;
}

.flow-dot{
  position:relative;
  z-index:1;
  margin:auto;
  width:36px;
  height:36px;
  border-radius:50%;
  background:#eef2f0;
  color:var(--muted);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:900;
  border:3px solid #fff;
}

.flow-step.active .flow-dot,
.flow-step.done .flow-dot{
  background:var(--green);
  color:#fff;
}

.flow-label{
  margin-top:6px;
  color:var(--muted);
  font-size:9px;
  font-weight:800;
}

.flow-step.active .flow-label,
.flow-step.done .flow-label{
  color:var(--green-dark);
}

/* =========================
   TABLES
========================= */

.table-wrap{
  overflow:auto;
}

.report-table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  min-width:700px;
  font-size:11px;
}

.report-table th{
  background:#f5f8f6;
  color:var(--navy);
  font-weight:900;
}

.report-table th,
.report-table td{
  border-bottom:1px solid var(--line);
  padding:11px 9px;
  text-align:center;
}

.report-table tbody tr:hover{
  background:#fbfdfc;
}

/* =========================
   DRIVER MESSAGE
========================= */

.driver-message{
  background:#f5faf7;
  border:1px solid #cfe8d8;
  border-radius:17px;
  padding:16px;
  white-space:pre-line;
  font-size:12px;
  line-height:2;
}

.message-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.message-actions button{
  flex:1;
}

/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

.empty-icon{
  font-size:35px;
  margin-bottom:8px;
}

.empty b{
  display:block;
  color:var(--navy);
  font-size:14px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:50%;
  bottom:25px;
  transform:translateX(50%) translateY(20px);
  background:var(--navy);
  color:#fff;
  border-radius:30px;
  padding:11px 21px;
  font-size:12px;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:9999;
  box-shadow:var(--shadow2);
}

.toast.show{
  opacity:1;
  transform:translateX(50%) translateY(0);
}

/* =========================
   PRINT
========================= */

#printArea{
  display:none;
}

@media print{
  body *{
    visibility:hidden!important;
  }

  #printArea,
  #printArea *{
    visibility:visible!important;
  }

  #printArea{
    display:block!important;
    position:absolute;
    right:0;
    top:0;
    width:100%;
    padding:25px;
    background:#fff;
  }

  .print-header{
    text-align:center;
    border-bottom:2px solid #111;
    padding-bottom:15px;
    margin-bottom:20px;
  }

  .print-header img{
    height:65px;
  }

  .print-table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
  }

  .print-table th,
  .print-table td{
    border:1px solid #222;
    padding:9px;
    text-align:center;
  }
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){
  .stat-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .header{
    align-items:flex-start;
  }

  .user-area{
    flex-direction:column;
    align-items:flex-end;
  }
}

@media(max-width:560px){
  .app{
    padding:10px 10px 70px;
  }

  .header{
    padding:12px;
    border-radius:17px;
  }

  .brand-logo{
    width:47px;
    height:47px;
  }

  .brand h1{
    font-size:17px;
  }

  .brand p{
    font-size:9px;
  }

  .user-badge{
    max-width:130px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .stat-grid{
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .stat{
    padding:13px;
  }

  .stat b{
    font-size:19px;
  }

  .row2,
  .row3{
    grid-template-columns:1fr;
  }

  .item-header,
  .item-row{
    grid-template-columns:1fr 70px 85px 34px;
  }

  .card{
    padding:15px;
    border-radius:16px;
  }

  .order-top{
    flex-direction:column;
  }

  .flow-step{
    min-width:110px;
  }
}
</style>
</head>

<body>

<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="printArea"></div>

<script>

/* =========================================================
   RASRAS PLASTIC ERP
   نظام إدارة أوامر البيع
========================================================= */

const LOGO_SRC =
"https://i.ibb.co/6R22M5n/rasras-logo.jpg";

/* =========================
   USERS
========================= */

let USERS = {
  admin:{
    pass:"1234",
    name:"المدير العام",
    role:"admin",
    stage:null
  },

  sales:{
    pass:"1234",
    name:"إدارة المبيعات",
    role:"sales",
    stage:null
  },

  logistics:{
    pass:"1234",
    name:"قسم النقل",
    role:"logistics",
    stage:"logistics_review"
  },

  accounts:{
    pass:"1234",
    name:"قسم الحسابات",
    role:"accounts",
    stage:"accounts_approval"
  },

  warehouse:{
    pass:"1234",
    name:"إدارة المخازن",
    role:"warehouse",
    stage:"warehouse_release"
  },

  driver:{
    pass:"1234",
    name:"مسئول التوصيل",
    role:"driver",
    stage:"with_driver"
  }
};

/* =========================
   WORKFLOW
========================= */

const STAGES = [

  {
    key:"manager_approval",
    label:"اعتماد المدير"
  },

  {
    key:"logistics_review",
    label:"مراجعة النقل"
  },

  {
    key:"accounts_approval",
    label:"اعتماد الحسابات"
  },

  {
    key:"warehouse_release",
    label:"إذن المخزن"
  },

  {
    key:"with_driver",
    label:"مع السائق"
  },

  {
    key:"delivered",
    label:"تم التسليم"
  },

  {
    key:"tax_pending",
    label:"إجراء الفاتورة الضريبية"
  },

  {
    key:"completed",
    label:"مكتمل"
  }

];

/* =========================
   DATABASE
========================= */

let DATA = {
  orders:[],
  parties:[],
  notifications:[],
  usersConfig:USERS
};

let currentUser = null;

let state = {
  view:"dashboard",
  orderType:"sale",
  selectedOrderId:null,
  draft:null
};

/* =========================================================
   STORAGE
========================================================= */

function loadData(){

  const raw =
    localStorage.getItem("RASRAS_ERP_DATABASE_V3");

  if(raw){

    try{

      DATA = JSON.parse(raw);

      if(!DATA.orders) DATA.orders=[];
      if(!DATA.parties) DATA.parties=[];
      if(!DATA.notifications) DATA.notifications=[];

      if(DATA.usersConfig){
        USERS = DATA.usersConfig;
      }

    }catch(e){

      console.error(e);

    }

  }else{

    DATA.parties=[

      {
        id:"P-10001",
        name:"شركة الأمل للبلاستيك",
        phone:"01000000000",
        address:"العاشر من رمضان",
        type:"عميل"
      },

      {
        id:"P-10002",
        name:"مؤسسة النور للخامات",
        phone:"01100000000",
        address:"بلبيس",
        type:"مورد"
      }

    ];

    saveData();

  }

  render();
}

function saveData(){

  DATA.usersConfig=USERS;

  localStorage.setItem(
    "RASRAS_ERP_DATABASE_V3",
    JSON.stringify(DATA)
  );
}

/* =========================================================
   HELPERS
========================================================= */

function uid(prefix){

  return prefix+"-"+Date.now()+"-"+Math.floor(
    100+Math.random()*900
  );

}

function todayISO(){

  return new Date().toISOString();

}

function fmtDate(date){

  if(!date) return "—";

  return new Date(date).toLocaleDateString(
    "ar-EG",
    {
      year:"numeric",
      month:"short",
      day:"numeric"
    }
  );

}

function fmtDateTime(date){

  if(!date) return "—";

  return new Date(date).toLocaleString(
    "ar-EG",
    {
      year:"numeric",
      month:"short",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

function fmtMoney(n){

  return Number(n||0).toLocaleString(
    "ar-EG",
    {
      maximumFractionDigits:2
    }
  )+" ج.م";

}

function itemsTotal(order){

  return (order.items||[]).reduce(
    (sum,item)=>
      sum+
      (Number(item.qty)||0)*
      (Number(item.price)||0),
    0
  );

}

function orderTotal(order){

  if(
    order.finalTotal !== undefined &&
    order.finalTotal !== null &&
    order.finalTotal !== ""
  ){
    return Number(order.finalTotal)||0;
  }

  return itemsTotal(order)+(Number(order.shippingCost)||0);

}

function getStageLabel(key){

  const s =
    STAGES.find(x=>x.key===key);

  return s ? s.label : key;

}

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent=message;

  toast.classList.add("show");

  setTimeout(
    ()=>toast.classList.remove("show"),
    2400
  );

}

/* =========================================================
   SUBMIT SALE
========================================================= */

function submitSale(){

  const name=
    document.getElementById("f_name").value.trim();

  const phone=
    document.getElementById("f_phone").value.trim();

  const address=
    document.getElementById("f_address").value.trim();

  const tax=
    document.getElementById("f_tax").value==="1";

  const pay=
    document.getElementById("f_pay").value;

  const collection=
    Number(
      document.getElementById("f_collection").value
    )||0;

  if(!name){

    showToast("أدخل اسم العميل");

    return;

  }

  if(!phone){

    showToast("أدخل تليفون العميل");

    return;

  }

  const items=[];

  document
    .querySelectorAll(".item-row")
    .forEach(row=>{

      const itemName=
        row.querySelector(".it-name")
          .value.trim();

      const qty=
        Number(
          row.querySelector(".it-qty").value
        )||0;

      const price=
        Number(
          row.querySelector(".it-price").value
        )||0;

      if(itemName && qty>0){

        items.push({
          name:itemName,
          qty,
          price
        });

      }

    });

  if(!items.length){

    showToast("أدخل صنف واحد على الأقل");

    return;

  }

  const order=state.draft;

  order.partyName=name;
  order.phone=phone;
  order.address=address;
  order.taxInvoice=tax;
  order.paymentMethod=pay;
  order.expectedCollection=collection;
  order.items=items;

  /*
    مهم:
    أمر البيع يذهب للمدير أولا.
    لا يذهب للنقل مباشرة.
  */

  order.stage="manager_approval";

  order.createdBy=
    currentUser.name;

  order.createdAt=
    todayISO();

  DATA.orders.unshift(order);

  DATA.parties=
    DATA.parties||[];

  const exists=
    DATA.parties.some(
      p=>p.name===name
    );

  if(!exists){

    DATA.parties.push({

      id:uid("P"),

      name,

      phone,

      address,

      type:"عميل"

    });

  }

  DATA.notifications.unshift({

    id:uid("NT"),

    type:"manager_order",

    orderId:order.id,

    title:"أمر بيع جديد يحتاج اعتماد المدير",

    message:
      `تم إنشاء أمر البيع ${order.id} للعميل ${name}`,

    read:false,

    createdAt:todayISO()

  });

  saveData();

  state.draft=null;

  state.view="dashboard";

  showToast(
    "تم حفظ أمر البيع وإرساله للمدير للاعتماد"
  );

  render();

}

function flowHTML(order){

  const currentIndex=
    STAGES.findIndex(
      x=>x.key===order.stage
    );

  return `

  <div class="flow">

    ${STAGES.map(
      (stage,index)=>`

      <div
        class="flow-step
          ${
            index<currentIndex
            ?"done"
            :
            index===currentIndex
            ?"active"
            :""
          }
        "
      >

        <div class="flow-dot">

          ${
            index<currentIndex
            ?"✓"
            :
            index+1
          }

        </div>

        <div class="flow-label">
          ${stage.label}
        </div>

      </div>

      `
    ).join("")}

  </div>

  `;

}

function buildDriverMessage(o){

  const collection=
    Number(o.expectedCollection)||0;

  const collectionText=
    collection>0

    ?

    `💰 التحصيل عند العميل: ${fmtMoney(collection)}`

    :

    `💰 التحصيل عند العميل: لا يوجد تحصيل`;

  const itemsText=
    o.items
      .map(
        item=>
          `• ${item.name} — الكمية: ${item.qty}`
      )
      .join("\n");

  return `

مرحباً ${o.driverName||"السائق"} 👋

لديك أمر توصيل جديد من RASRAS PLASTIC

📋 رقم الأمر: ${o.id}

👤 العميل:
${o.partyName}

📞 هاتف العميل:
${o.phone}

📍 العنوان:
${o.address||"غير محدد"}

📦 الكميات:
${itemsText}

${collectionText}

يرجى تأكيد التسليم بعد استلام البضاعة من المخزن.

شكراً،
RASRAS PLASTIC
`;

/* =========================================================
   DRIVER WHATSAPP
========================================================= */

function normalizeEgyptPhone(phone){

  let p=
    String(phone||"")
      .replace(/\D/g,"");

  if(p.startsWith("01")){

    p="20"+p.substring(1);

  }

  if(p.startsWith("0020")){

    p=p.substring(2);

  }

  return p;

}

function sendDriverWhatsApp(id){

  const o=
    DATA.orders.find(
      x=>x.id===id
    );

  if(!o || !o.driverPhone){

    showToast(
      "رقم السائق غير موجود"
    );

    return;

  }

  const phone=
    normalizeEgyptPhone(
      o.driverPhone
    );

  const message=
    o.driverMessage ||
    buildDriverMessage(o);

  const url=
    "https://wa.me/"+
    phone+
    "?text="+
    encodeURIComponent(message);

  window.open(
    url,
    "_blank"
  );

}

function copyDriverMessage(id){

  const o=
    DATA.orders.find(
      x=>x.id===id
    );

  if(!o) return;

  const message=
    o.driverMessage ||
    buildDriverMessage(o);

  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard
      .writeText(message)
      .then(
        ()=>showToast(
          "تم نسخ رسالة السائق"
        )
      );

  }else{

    showToast(
      "انسخ الرسالة يدوياً"
    );

  }

}

                  :"لا"
                }
              </td>

              <td>
                ${fmtMoney(orderTotal(o))}
              </td>

              <td>

                <span class="pill stage-${o.stage}">
                  ${getStageLabel(o.stage)}
                </span>

              </td>

            </tr>

            `
          ).join("")}

        </tbody>

      </table>

    </div>

  </div>

  `;

}

function saveParty(){

  const name=
    document
      .getElementById("p_name")
      .value.trim();

      .getElementById("p_phone")
      .value.trim();

  const type=
    document
      .getElementById("p_type")

      .getElementById("p_address")
      .value.trim();

      "أدخل اسم العميل"

          ${Object.keys(USERS).map(

            <tr>

              <td>
                <b>${escapeHTML(key)}</b>

              </td>

                ${roleLabel(USERS[key].role)}
              </td>

              <td>

                ${
                  key!=="admin"

                  ?

                  `
                  <button
                    class="btn-danger"
                    onclick="deleteUser('${escapeAttr(key)}')"
                  >
                    حذف
                  </button>
                  `

                  :

                  "المدير الرئيسي"
                }

              </td>

            </tr>

            `
          ).join("")}

function roleLabel(role){

  const labels={

    sales:"المبيعات",

    logistics:"النقل",

    accounts:"الحسابات",

    warehouse:"المخازن",

    driver:"السائق",

    admin:"مدير النظام"

  };

  return labels[role]||role;

}

function saveUser(){

  const key=
    document
      .getElementById("u_key")
      .value.trim();

  const name=
    document
      .getElementById("u_name")
      .value.trim();

  const pass=
    document
      .getElementById("u_pass")
      .value.trim();

  const role=
    document
      .getElementById("u_role")
      .value;

  if(!key||!name||!pass){

    showToast(
      "أكمل البيانات المطلوبة"
    );

    return;

  }

  let stage=null;

  if(role==="logistics")
    stage="logistics_review";

  if(role==="accounts")
    stage="accounts_approval";

  if(role==="warehouse")
    stage="warehouse_release";

  if(role==="driver")
    stage="with_driver";

  USERS[key]={

    pass,

    name,

    role,

    stage

  };

  saveData();

  showToast(
    "تم حفظ المستخدم"
  );

  render();

}

function deleteUser(key){

  if(
    !confirm(
      "هل تريد حذف هذا المستخدم؟"
    )
  ) return;

  delete USERS[key];

  saveData();

  showToast(
    "تم حذف المستخدم"
  );

  render();

}

/* =========================================================
   APP EVENTS
========================================================= */

function bindAppEvents(){

  const logout=
    document.getElementById(
      "logoutBtn"
    );

  if(logout){

    logout.onclick=()=>{

      currentUser=null;

      state={
        view:"dashboard",
        orderType:"sale",
        selectedOrderId:null,
        draft:null
      };

      render();

    };

  }

  document
    .querySelectorAll(".tab")
    .forEach(tab=>{

      tab.onclick=()=>{

        state.view=
          tab.dataset.v;

        if(
          state.view!=="new_sale"
        ){

          state.draft=null;

        }

        render();

      };

    });

}

/* =========================================================
   OPEN ORDER
========================================================= */

function openOrder(id){

  state.selectedOrderId=id;

  state.view="detail";

  render();

}

function goDashboard(){

  state.view="dashboard";

  state.selectedOrderId=null;

  render();

}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escapeAttr(value){

  return escapeHTML(value);

}
