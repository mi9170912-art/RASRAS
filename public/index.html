<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشروع Supabase</title>
  
  <!-- استدعاء مكتبة Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      direction: rtl;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 90%;
      max-width: 450px;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      color: #1f2937;
      margin-bottom: 12px;
    }
    p {
      color: #6b7280;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    .status-box {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .loading { background-color: #eff6ff; color: #1d4ed8; }
    .success { background-color: #ecfdf5; color: #047857; }
    .error { background-color: #fef2f2; color: #b91c1c; }
  </style>
</head>
<body>

  <div class="container">
    <h1>حالة الاتصال</h1>
    <p id="sub-title">جاري فحص الاتصال بـ Supabase...</p>
    <div id="status-badge" class="status-box loading">جاري التحميل...</div>
  </div>

  <script>
    // 1. بيانات الربط الخاصة بك في Supabase
    const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_URL.supabase.co';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';

    // 2. إنشاء الكلاينت باسم جديد تماماً لتجنب مشكلة 'supabase' has already been declared
    let supabaseClient = null;

    function initSupabase() {
      try {
        if (typeof supabase !== 'undefined') {
          supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          checkConnection();
        } else {
          showStatus('خطأ في تحميل مكتبة Supabase', 'error');
        }
      } catch (err) {
        console.error('Initialization Error:', err);
        showStatus('فشل في إعداد الاتصال', 'error');
      }
    }

    // 3. دالة تجريبية للاختبار والـ Console Log
    async function checkConnection() {
      const badge = document.getElementById('status-badge');
      const subTitle = document.getElementById('sub-title');

      try {
        // اختبار الاتصال بجدول من اختيارك (غير 'your_table' لاسم جدولك)
        const { data, error } = await supabaseClient
          .from('your_table')
          .select('*')
          .limit(1);

        if (error) {
          // إذا اشتغل الاتصال لكن اسم الجدول غلط مثلاً
          console.warn('Supabase Notice:', error.message);
          showStatus('الموقع شغال والربط قائم', 'success');
          subTitle.textContent = 'تأكد من كتابة اسم الجدول الصحيح في الكود.';
        } else {
          console.log('بيانات الجدول:', data);
          showStatus('تم الاتصال بنجاح (Ready)', 'success');
          subTitle.textContent = 'الموقع يعمل بشكل ممتاز ومرتبط بـ Supabase.';
        }
      } catch (err) {
        console.error('Connection Error:', err);
        showStatus('حدث خطأ أثناء الاتصال', 'error');
      }
    }

    function showStatus(message, statusClass) {
      const badge = document.getElementById('status-badge');
      badge.textContent = message;
      badge.className = `status-box ${statusClass}`;
    }

    // تشغيل التكوين فور اكتمال عناصر DOM
    document.addEventListener('DOMContentLoaded', initSupabase);
  </script>
</body>
</html>
