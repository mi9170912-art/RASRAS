<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087443">
<title>RASRAS PLASTIC | نظام إدارة أوامر البيع والشراء</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --green:#087443;
  --green-2:#0b9254;
  --green-dark:#04512f;
  --green-soft:#eaf8f0;
  --green-border:#bfe8cf;

  --navy:#10251c;
  --ink:#17221d;
  --muted:#718078;

  --bg:#f3f7f5;
  --card:#ffffff;
  --line:#e2ebe6;

  --orange:#d97706;
  --orange-soft:#fff7e8;

  --blue:#087ca5;
  --blue-soft:#e9f7fc;

  --pink:#be185d;
  --pink-soft:#fdf0f6;

  --yellow:#a16207;
  --yellow-soft:#fffbea;

  --red:#dc2626;
  --red-soft:#fff0f0;

  --shadow:0 8px 30px rgba(16,37,28,.06);
  --shadow-lg:0 18px 55px rgba(16,37,28,.10);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:
    radial-gradient(circle at top right,rgba(8,116,67,.07),transparent 30%),
    var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

button,input,select{
  font-family:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:min(1180px,100%);
  margin:auto;
  padding:20px 18px 90px;
}

/* =========================
   LOGO
========================= */

.app-logo{
  width:58px;
  height:58px;
  object-fit:contain;
  border-radius:16px;
  background:#fff;
  padding:5px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.login-logo-img{
  width:105px;
  height:105px;
  object-fit:contain;
  border-radius:25px;
  padding:8px;
  background:#fff;
  box-shadow:0 15px 35px rgba(8,116,67,.14);
}

/* =========================
   LOGIN
========================= */

.login-screen{
  min-height:calc(100vh - 40px);
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-card{
  width:min(450px,100%);
  background:rgba(255,255,255,.96);
  border:1px solid var(--line);
  border-radius:30px;
  padding:40px 30px 30px;
  box-shadow:var(--shadow-lg);
  text-align:center;
  position:relative;
  overflow:hidden;
}

.login-card:before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  left:0;
  height:6px;
  background:linear-gradient(90deg,var(--green-dark),var(--green-2));
}

.login-card h2{
  margin:8px 0 3px;
  color:var(--navy);
  font-size:25px;
  font-weight:900;
  letter-spacing:.2px;
}

.login-card .login-subtitle{
  margin:0 0 28px;
  color:var(--green);
  font-size:13px;
  font-weight:800;
}

.login-footer{
  margin-top:20px;
  font-size:11px;
  color:var(--muted);
}

/* =========================
   HEADER
========================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:5px 0 20px;
  border-bottom:1px solid var(--line);
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.brand-text h1{
  margin:0;
  font-size:22px;
  line-height:1.2;
  font-weight:900;
  color:var(--navy);
}

.brand-text p{
  margin:4px 0 0;
  color:var(--green);
  font-size:12px;
  font-weight:800;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.user-badge{
  background:var(--green-soft);
  color:var(--green-dark);
  border:1px solid var(--green-border);
  padding:7px 13px;
  border-radius:30px;
  font-size:12px;
  font-weight:800;
}

.logout-btn{
  border:1px solid #ffd0d0;
  background:#fff;
  color:var(--red);
  padding:7px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}

/* =========================
   NAVIGATION
========================= */

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 1px 10px;
  margin-bottom:20px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:4px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--muted);
  padding:11px 17px;
  border-radius:13px;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 2px 5px rgba(0,0,0,.02);
}

.tab:hover{
  border-color:var(--green-border);
  color:var(--green);
  transform:translateY(-1px);
}

.tab.active{
  color:#fff;
  background:linear-gradient(135deg,var(--green-dark),var(--green-2));
  border-color:transparent;
  box-shadow:0 7px 18px rgba(8,116,67,.22);
}

.tab .badge{
  min-width:20px;
  text-align:center;
  background:#ef4444;
  color:#fff;
  padding:1px 5px;
  border-radius:20px;
  font-size:10px;
}

/* =========================
   CARDS
========================= */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px;
  margin-bottom:17px;
  box-shadow:var(--shadow);
}

.card-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.card-title h3{
  margin:0;
  font-size:17px;
  font-weight:900;
  color:var(--navy);
}

.card-title p{
  margin:3px 0 0;
  font-size:11px;
  color:var(--muted);
}

/* =========================
   DASHBOARD
========================= */

.dashboard-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:15px;
  margin:5px 0 17px;
}

.dashboard-head h2{
  margin:0;
  font-size:23px;
  font-weight:900;
  color:var(--navy);
}

.dashboard-head p{
  margin:3px 0 0;
  font-size:12px;
  color:var(--muted);
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px;
  margin-bottom:18px;
}

.stat-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:19px;
  padding:18px;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.stat-card:after{
  content:"";
  position:absolute;
  width:75px;
  height:75px;
  border-radius:50%;
  left:-22px;
  bottom:-28px;
  background:var(--green-soft);
}

.stat-icon{
  width:40px;
  height:40px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--green-soft);
  color:var(--green);
  font-size:19px;
  margin-bottom:10px;
}

.stat-card b{
  display:block;
  color:var(--navy);
  font-size:24px;
  line-height:1.2;
  font-weight:900;
}

.stat-card span{
  color:var(--muted);
  font-size:11.5px;
  font-weight:700;
}

.dashboard-section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:4px 0 12px;
}

.dashboard-section-title h3{
  margin:0;
  font-size:17px;
  font-weight:900;
}

/* =========================
   ORDERS
========================= */

.order-item{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:17px;
  margin-bottom:10px;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 2px 8px rgba(0,0,0,.025);
}

.order-item:hover{
  transform:translateY(-2px);
  border-color:var(--green-border);
  box-shadow:0 9px 22px rgba(8,116,67,.08);
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.order-id{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}

.order-name{
  color:var(--navy);
  font-size:16px;
  font-weight:900;
  margin-top:3px;
}

.order-meta{
  color:var(--muted);
  font-size:11.5px;
  margin-top:5px;
}

.order-meta b{
  color:var(--green-dark);
}

.order-type{
  display:inline-block;
  padding:3px 8px;
  border-radius:7px;
  margin-inline-start:5px;
  font-size:10px;
  font-weight:800;
}

.order-type.sale{
  background:var(--green-soft);
  color:var(--green-dark);
}

.order-type.purchase{
  background:#f1f5f9;
  color:#475569;
}

/* =========================
   STATUS
========================= */

.pill{
  font-size:10.5px;
  font-weight:900;
  padding:6px 11px;
  border-radius:20px;
  white-space:nowrap;
}

.pill.stage-sales_created{
  background:#f1f5f9;
  color:#64748b;
}

.pill.stage-logistics_review{
  background:var(--orange-soft);
  color:var(--orange);
}

.pill.stage-accounts_approval{
  background:var(--blue-soft);
  color:var(--blue);
}

.pill.stage-warehouse_release{
  background:var(--pink-soft);
  color:var(--pink);
}

.pill.stage-with_driver{
  background:var(--yellow-soft);
  color:var(--yellow);
}

.pill.stage-delivered{
  background:var(--green-soft);
  color:var(--green-dark);
}

/* =========================
   FORM
========================= */

label{
  display:block;
  color:var(--navy);
  font-size:12.5px;
  font-weight:800;
  margin:15px 0 6px;
}

label:first-child{
  margin-top:0;
}

input[type=text],
input[type=password],
input[type=tel],
input[type=number],
select{
  width:100%;
  padding:12px 14px;
  background:#fbfdfc;
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
  color:var(--ink);
  font-size:13px;
  transition:.2s;
}

input:focus,
select:focus{
  background:#fff;
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(8,116,67,.08);
}

.row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.seg{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-bottom:17px;
}

.seg-btn{
  padding:13px;
  border-radius:13px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--muted);
  font-size:13px;
  font-weight:900;
  cursor:pointer;
}

.seg-btn.active{
  background:var(--navy);
  color:#fff;
  border-color:var(--navy);
}

/* =========================
   ITEMS
========================= */

.items-head{
  display:grid;
  grid-template-columns:1fr 70px 100px 34px;
  gap:8px;
  margin-bottom:6px;
  padding:0 2px;
}

.items-head span{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}

.item-row{
  display:grid;
  grid-template-columns:1fr 70px 100px 34px;
  gap:8px;
  margin-bottom:8px;
  align-items:center;
}

.item-row input{
  padding:10px;
  font-size:12px;
}

.rm-btn{
  width:34px;
  height:34px;
  border-radius:10px;
  border:1px solid #ffd1d1;
  background:#fff;
  color:var(--red);
  font-size:18px;
  cursor:pointer;
}

.add-item-btn{
  width:100%;
  padding:12px;
  border:1px dashed var(--green-border);
  border-radius:12px;
  background:var(--green-soft);
  color:var(--green-dark);
  font-size:12.5px;
  font-weight:900;
  cursor:pointer;
  margin-top:5px;
}

.total-box{
  margin-top:16px;
  padding:16px;
  border-radius:14px;
  background:linear-gradient(135deg,#f0faf4,#f8fcfa);
  border:1px solid var(--green-border);
}

.total-line{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font-size:13px;
  color:var(--muted);
  padding:4px 0;
}

.total-line strong{
  color:var(--navy);
  font-size:15px;
}

.total-final{
  margin-top:8px;
  padding-top:11px;
  border-top:1px solid var(--green-border);
}

.total-final span{
  color:var(--green-dark);
  font-weight:900;
}

.total-final b{
  color:var(--green-dark);
  font-size:21px;
}

/* =========================
   BUTTONS
========================= */

.btn-primary{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,var(--green-dark),var(--green-2));
  color:#fff;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  margin-top:16px;
  box-shadow:0 7px 18px rgba(8,116,67,.22);
  transition:.2s;
}

.btn-primary:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 22px rgba(8,116,67,.28);
}

.btn-secondary{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  margin-top:8px;
}

.btn-danger{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #ffd1d1;
  background:var(--red-soft);
  color:var(--red);
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  margin-top:8px;
}

/* =========================
   REPORTS
========================= */

.report-summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}

.report-kpi{
  border:1px solid var(--line);
  background:#fff;
  border-radius:17px;
  padding:17px;
  box-shadow:var(--shadow);
}

.report-kpi small{
  display:block;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  margin-bottom:5px;
}

.report-kpi strong{
  display:block;
  color:var(--navy);
  font-size:19px;
  font-weight:900;
}

.report-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.report-header{
  padding:19px 20px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.report-header h3{
  margin:0;
  font-size:17px;
  font-weight:900;
}

.report-header span{
  color:var(--muted);
  font-size:11px;
}

.table-wrap{
  width:100%;
  overflow-x:auto;
}

.report-table{
  width:100%;
  min-width:700px;
  border-collapse:collapse;
  font-size:12px;
}

.report-table th,
.report-table td{
  padding:12px 10px;
  text-align:center;
  border-bottom:1px solid var(--line);
}

.report-table th{
  background:#f5f9f7;
  color:var(--navy);
  font-size:11px;
  font-weight:900;
  white-space:nowrap;
}

.report-table td{
  color:#435249;
}

.report-table tbody tr:hover{
  background:#fbfdfc;
}

.report-table tbody tr:last-child td{
  border-bottom:0;
}

.amount{
  color:var(--green-dark);
  font-weight:900;
  white-space:nowrap;
}

/* =========================
   DETAILS
========================= */

.detail-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding-bottom:15px;
  border-bottom:1px solid var(--line);
}

.detail-id{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}

.detail-name{
  margin-top:3px;
  color:var(--navy);
  font-size:20px;
  font-weight:900;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:16px;
}

.info-box{
  padding:12px;
  border-radius:12px;
  background:#f7faf8;
  border:1px solid var(--line);
}

.info-box span{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  margin-bottom:2px;
}

.info-box b{
  color:var(--navy);
  font-size:12px;
}

.stage-flow{
  display:flex;
  gap:5px;
  margin:20px 0 5px;
  overflow-x:auto;
  padding-bottom:4px;
}

.stage-step{
  flex:1;
  min-width:110px;
  text-align:center;
}

.stage-line{
  height:5px;
  border-radius:10px;
  background:#e8eeeb;
  margin-bottom:7px;
}

.stage-step.done .stage-line,
.stage-step.current .stage-line{
  background:var(--green);
}

.stage-step span{
  color:var(--muted);
  font-size:9.5px;
  font-weight:800;
}

.stage-step.current span{
  color:var(--green-dark);
}

/* =========================
   USERS / PARTIES
========================= */

.section-label{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:15px;
}

.section-label:before{
  content:"";
  width:5px;
  height:22px;
  border-radius:8px;
  background:var(--green);
}

.section-label h3{
  margin:0;
  color:var(--navy);
  font-size:17px;
  font-weight:900;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:50%;
  bottom:25px;
  transform:translateX(50%) translateY(10px);
  min-width:240px;
  max-width:calc(100% - 30px);
  background:var(--navy);
  color:#fff;
  padding:13px 20px;
  border-radius:30px;
  text-align:center;
  font-size:12.5px;
  font-weight:800;
  box-shadow:0 12px 35px rgba(0,0,0,.2);
  z-index:9999;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateX(50%) translateY(0);
}

/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

.empty-icon{
  width:55px;
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  margin:0 auto 10px;
  background:var(--green-soft);
  font-size:23px;
}

.empty b{
  display:block;
  color:var(--navy);
  margin-bottom:3px;
}

/* =========================
   PRINT
========================= */

#printArea{
  display:none;
}

@media print{

  body{
    background:#fff !important;
  }

  body *{
    visibility:hidden !important;
  }

  #printArea,
  #printArea *{
    visibility:visible !important;
  }

  #printArea{
    display:block !important;
    position:absolute;
    right:0;
    top:0;
    width:100%;
    padding:20px;
    color:#111 !important;
    background:#fff;
  }

  .print-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:3px solid #087443;
    padding-bottom:12px;
    margin-bottom:18px;
  }

  .print-logo{
    width:85px;
    height:85px;
    object-fit:contain;
  }

  .print-company{
    text-align:center;
    flex:1;
  }

  .print-company h1{
    margin:0;
    font-size:24px;
    font-weight:900;
  }

  .print-company p{
    margin:3px 0;
    font-size:11px;
  }

  .print-title{
    text-align:center;
    margin:15px 0;
    font-size:20px;
    font-weight:900;
  }

  .print-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:15px;
  }

  .print-info div{
    border:1px solid #ddd;
    padding:8px;
    font-size:11px;
  }

  .print-table{
    width:100%;
    border-collapse:collapse;
    font-size:11px;
  }

  .print-table th,
  .print-table td{
    border:1px solid #bbb;
    padding:8px;
    text-align:center;
  }

  .print-table th{
    background:#f1f1f1;
    font-weight:900;
  }

  .print-total{
    margin-top:15px;
    margin-right:auto;
    width:300px;
    border:1px solid #ccc;
    padding:10px;
  }

  .print-signatures{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;

<div class="app" id="app"></div>

<script>

/* ============================================================

============================================================ */

/* اللوجو */
const LOGO_SRC =
"https://i.ibb.co/6R22M5n/rasras-logo.jpg";

/* المستخدمون الافتراضيون */
let USERS = {

    pass:"1234",

  },

    pass:"1234",

    role:"warehouse",

    pass:"1234",
    name:"مسئول التوصيل",

    stage:"with_driver"

};

/* مراحل دورة الأمر */
const STAGES = [

  {
    key:"sales_created",
    label:"تم إنشاء الأمر"
  },

  {
    key:"logistics_review",
    label:"مراجعة النقل"
  },

  {
    key:"accounts_approval",
    label:"اعتماد الحسابات"
  },

  {
    key:"warehouse_release",
    label:"إذن المخزن"

  {
    key:"with_driver",
    label:"مع السائق"
  },

  {
    key:"delivered",
    label:"تم التسليم"
  }

];

/* قاعدة البيانات المحلية */
let DATA = {

  orders:[],
  parties:[],
  usersConfig:USERS

};

let LOADED = false;
let currentUser = null;

let state = {

  view:"dashboard",
  orderType:"sale",
  selectedOrderId:null,
  draft:null

};


/* ============================================================
   DATABASE
============================================================ */

function loadData(){

  const local =
    localStorage.getItem("RASRAS_SYSTEM_DATABASE_V3");

  if(local){

    try{

      DATA = JSON.parse(local);

      if(!DATA.orders)
        DATA.orders=[];

      if(!DATA.parties)
        DATA.parties=[];

      if(DATA.usersConfig)
        USERS=DATA.usersConfig;

    }catch(e){

      console.error(e);

    }

  }else{

    DATA.parties=[

      {
        id:"P-10001",
        name:"شركة الأمل للبلاستيك",
        phone:"01000000000",
        address:"العاشر من رمضان",
        type:"عميل"
      },

      {
        id:"P-10002",
        name:"مؤسسة النور للخامات",
        phone:"01100000000",
        address:"بلبيس",
        type:"مورد"
      }

    ];

    saveData();

  }

  LOADED=true;

  render();

}


function saveData(){

  DATA.usersConfig=USERS;

  localStorage.setItem(
    "RASRAS_SYSTEM_DATABASE_V3",
    JSON.stringify(DATA)
  );

}


/* ============================================================
   HELPERS
============================================================ */

function uid(prefix){

  return prefix+"-"+Date.now().toString().slice(-6)+
         Math.floor(Math.random()*90+10);

}


function todayISO(){

  return new Date().toISOString();

}


function fmtDate(iso){

  if(!iso)
    return "—";

  return new Date(iso).toLocaleDateString(
    "ar-EG",
    {
      year:"numeric",
      month:"short",
      day:"numeric"
    }
  );

}


function fmtDateTime(iso){

  if(!iso)
    return "—";

  return new Date(iso).toLocaleString(
    "ar-EG",
    {
      year:"numeric",
      month:"short",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function fmtMoney(n){

  return Number(n||0).toLocaleString(
    "ar-EG",
    {
      minimumFractionDigits:0,
      maximumFractionDigits:2
    }
  )+" ج.م";

}


function itemsTotal(order){

  return (order.items||[]).reduce(

    (sum,item)=>
      sum+
      (Number(item.qty)||0)*
      (Number(item.price)||0),

    0

  );

}


function orderTotal(order){

  if(
    order.finalTotal !== undefined &&
    order.finalTotal !== null &&
    Number(order.finalTotal)>0
  ){

    return Number(order.finalTotal);

  }

  return itemsTotal(order)+
         (Number(order.shippingCost)||0);

}


function showToast(msg){

  const t=document.getElementById("toast");

  t.textContent=msg;

  t.classList.add("show");

  setTimeout(
    ()=>t.classList.remove("show"),
    2300
  );

}


function escapeHTML(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ============================================================
   NEW ORDER
============================================================ */

function newDraft(type){

  return{

    id:uid(
      type==="sale"
      ?"SO"
      :"PO"
    ),

    type,

    partyName:"",
    phone:"",
    address:"",

    taxInvoice:false,

    paymentMethod:"نقدي",

    items:[
      {
        name:"",
        qty:1,
        price:0
      }
    ],

    shippingCost:0,

    finalTotal:0,

    stage:"sales_created",

    driverName:"",

    createdBy:
      currentUser
      ?currentUser.name
      :"المبيعات",

    createdAt:todayISO()

  };

}


/* ============================================================
   MAIN RENDER
============================================================ */

function render(){

  const app=document.getElementById("app");

  if(!LOADED){

    app.innerHTML=`

      <div class="login-screen">

        <div class="card" style="
          max-width:360px;
          width:100%;
          text-align:center;
        ">

          <img
            src="${LOGO_SRC}"

            onerror="this.style.display='none'"

          <h3>جاري تحميل النظام...</h3>

        </div>

      </div>

    `;

    return;

  }


  if(!currentUser){

    app.innerHTML=loginHTML();

    bindLoginEvents();

    return;

  }


  app.innerHTML=

    headerHTML()+
    tabsHTML()+
    viewHTML();

  bindAppEvents();

}

   LOGIN
============================================================ */

function loginHTML(){

  return`

    <div class="login-screen">

        <img
          src="${LOGO_SRC}"

function headerHTML(){

/* ============================================================

============================================================ */

}


/* ============================================================

============================================================ */

function viewHTML(){

  if(state.view==="dashboard")

  if(
    ["new_sale","new_purchase"].includes(
      state.view
    )
  )
    return newOrderHTML();

  if(state.view==="approvals")
    return approvalsHTML();

  if(state.view==="reports")
    return reportsHTML();

  if(state.view==="customers")
    return customersHTML();

  if(state.view==="users")
    return usersManagementHTML();

  if(state.view==="detail")
    return detailHTML();

  return"";

}

============================================================ */

          <div class="order-name">

          ${st.label}
        </span>

/* ============================================================

                ${escapeHTML(p.name)}
                - ${escapeHTML(p.phone||"")}

          .join("")
        }

      >

        <div>

      </div>


      <label>

      </label>

      <input

        طريقة الدفع / التحصيل
      </label>

      <select id="f_pay">

        <option
          value="نقدي"

          نقدي
        </option>

        <option
          value="آجل"
          ${d.paymentMethod==="آجل"?"selected":""}
        >
          آجل
        </option>

        <option
          value="شيك"
          ${d.paymentMethod==="شيك"?"selected":""}

          value="تحويل"

    <div class="card">

      <div class="card-title">

        <div>

          <h3>
            الأصناف والأسعار

        </div>

      </div>

        <span>الصنف / الخامة</span>

        <span></span>

      </div>

        ${d.items
          .map(
            (it,idx)=>`

              <div
                class="item-row"
                data-idx="${idx}"

                <input
                  type="text"
                  class="it-name"
                  placeholder="اسم الصنف / الخامة"
                  value="${escapeHTML(it.name)}"
                >

                <input
                  type="number"

                  class="it-qty"
                  placeholder="الكمية"
                  value="${it.qty}"

                  min="0"
                  class="it-price"
                  placeholder="السعر"
                  value="${it.price}"
                >

                <button

          <span>
            مجموع الأصناف

          <strong>
            ${fmtMoney(itemsTotal(d))}
          </strong>

        </div>

          <span>
            الإجمالي المبدئي
          </span>

          <b>
            ${fmtMoney(itemsTotal(d))}
          </b>

        </div>

      </div>

    </div>


    <button
      class="btn-primary"
      onclick="submitOrder()"

      حفظ الأمر وتحويله إلى قسم النقل

  `;

/* ============================================================
   PARTY
============================================================ */

function onPartySelect(sel){

  const opt=
    sel.options[sel.selectedIndex];

  if(!opt.value)
    return;

  document.getElementById("f_name").value=
    opt.value;

  document.getElementById("f_phone").value=
    opt.dataset.phone||"";

  document.getElementById("f_address").value=
    opt.dataset.address||"";

}

   APPROVALS
============================================================ */

function approvalsHTML(){

  if(
    !currentUser.stage &&
    currentUser.role!=="admin"
  ){

    return`

        <div class="empty-icon">
          ✓

        <b>
          لا توجد مرحلة اعتماد مرتبطة بحسابك
        </b>

      </div>

    `;

  const list=

    currentUser.role==="admin"

    ?DATA.orders.filter(
        o=>o.stage!=="delivered"
      )

    :DATA.orders.filter(
        o=>o.stage===currentUser.stage
      );


  return`

============================================================ */

function saveParty(){

  const name=
    document.getElementById("p_name")
      .value.trim();

  const phone=
    document.getElementById("p_phone")
      .value.trim();

  const type=
    document.getElementById("p_type")
      .value;

  const address=
    document.getElementById("p_address")
      .value.trim();


  if(!name){

    showToast(
      "من فضلك أدخل اسم العميل أو المورد"
    );

    return;

  }


  if(
    DATA.parties.some(
      p=>p.name.toLowerCase()===name.toLowerCase()
    )
  ){

    showToast(
      "هذه الجهة موجودة بالفعل"
    );

    return;

  }


  DATA.parties.push({

    id:uid("P"),
    name,
    phone,
    type,
    address

  });


  saveData();

  showToast(
    "تم حفظ البيانات بنجاح"
  );

  render();

}

   SAVE USER
============================================================ */

function saveUser(){

  const k=
    document.getElementById("u_key")
      .value.trim();

  const name=
    document.getElementById("u_name")
      .value.trim();

  const pass=
    document.getElementById("u_pass")
      .value.trim();

  const role=
    document.getElementById("u_role")
      .value;


  if(!k||!name||!pass){

    showToast(
      "أكمل البيانات المطلوبة"
    );

    return;

  }


  let stage=null;

  if(role==="logistics")
    stage="logistics_review";

  if(role==="accounts")
    stage="accounts_approval";

  if(role==="warehouse")
    stage="warehouse_release";

  if(role==="driver")
    stage="with_driver";


  USERS[k]={

    pass,
    name,
    role,
    stage

  };


  saveData();

  showToast(
    "تم حفظ المستخدم بنجاح"
  );

  render();

}


function deleteUser(k){

  if(k==="admin")
    return;


  if(
    confirm(
      "هل أنت متأكد من حذف المستخدم؟"
    )
  ){

    delete USERS[k];

    saveData();

    showToast(
      "تم حذف المستخدم"
    );

    render();

  }

}

        >
          ✓ تأكيد استلام العميل وإتمام الأمر
        </button>

    `;

  }


  return"";

}


/* ============================================================
   APPROVAL FUNCTIONS
============================================================ */

function approveLogistics(id){

  const o=
    DATA.orders.find(
      x=>x.id===id
    );

  if(!o)
    return;


  o.shippingCost=
    Number(
      document.getElementById(
        "shipInput"
      ).value
    )||0;


  o.stage="accounts_approval";

  o.updatedAt=todayISO();

  saveData();

  showToast(
    "تم اعتماد النقل وتحويل الأمر للحسابات"
  );

  render();

}


function approveAccounts(id){

  const o=
    DATA.orders.find(
      x=>x.id===id
    );

  if(!o)
    return;


  const value=
    Number(
      document.getElementById(
        "totalInput"
      ).value
    );


  if(!value||value<0){

    showToast(
      "أدخل إجمالي صحيح"
    );

    return;

  }


  o.finalTotal=value;

  o.stage="warehouse_release";

  o.updatedAt=todayISO();

  saveData();

  showToast(
    "تم اعتماد المبلغ وتحويل الأمر للمخزن"
  );

  render();

}


function approveWarehouse(id){

  const o=
    DATA.orders.find(
      x=>x.id===id
    );

  if(!o)
    return;


  const driver=
    document.getElementById(
      "driverInput"
    ).value.trim();


  if(!driver){

    showToast(
      "أدخل اسم السائق"
    );

    return;

  }


  o.driverName=driver;

  o.stage="with_driver";

  o.updatedAt=todayISO();

  saveData();

  showToast(
    "تم إصدار إذن الصرف وتسليم الأمر للسائق"
  );

  render();

}


function approveDelivery(id){

  const o=
    DATA.orders.find(
      x=>x.id===id
    );

  if(!o)
    return;


  o.stage="delivered";

  o.deliveredAt=todayISO();

  o.updatedAt=todayISO();

  saveData();

  showToast(
    "تم إتمام التسليم بنجاح"
  );

  render();

}

/* ============================================================
   EVENTS
============================================================ */

function bindLoginEvents(){

  const loginBtn=
    document.getElementById(
      "loginBtn"
    );


  if(loginBtn){

    loginBtn.onclick=()=>{

      const uKey=
        document.getElementById(
          "loginUser"
        ).value;

      const pass=
        document.getElementById(
          "loginPass"
        ).value;


      if(
        USERS[uKey] &&
        USERS[uKey].pass===pass
      ){

        currentUser=USERS[uKey];

        state.view="dashboard";

        render();

      }else{

        showToast(
          "كلمة السر غير صحيحة"
        );

      }

    };

  }


  const passInput=
    document.getElementById(
      "loginPass"
    );


  if(passInput){

    passInput.addEventListener(
      "keydown",
      e=>{
        if(e.key==="Enter")
          loginBtn.click();
      }
    );

  }

}


function bindAppEvents(){

  const logoutBtn=
    document.getElementById(
      "logoutBtn"
    );


  if(logoutBtn){

    logoutBtn.onclick=()=>{

      currentUser=null;

      state.view="dashboard";

      state.draft=null;

      render();

    };

  }


  document
    .querySelectorAll(".tab")
    .forEach(
      el=>{

        el.onclick=()=>{

          state.view=
            el.dataset.v;

          render();

        };

      }
    );


  const btnSale=
    document.getElementById(
      "btnTypeSale"
    );


  if(btnSale){

    btnSale.onclick=()=>{

      state.orderType="sale";

      state.draft=null;

      render();

    };

  }


  const btnPur=
    document.getElementById(
      "btnTypePurchase"
    );


  if(btnPur){

    btnPur.onclick=()=>{

      state.orderType="purchase";

      state.draft=null;

      render();

    };

  }

}


/* ============================================================
   ITEMS
============================================================ */

function addItem(){

  if(!state.draft)
    return;


  syncDraftItems();


  state.draft.items.push({

    name:"",
    qty:1,
    price:0

  });


  render();

}


function rmItem(idx){

  if(
    !state.draft ||
    state.draft.items.length<=1
  )
    return;


  syncDraftItems();

  state.draft.items.splice(
    idx,
    1
  );

  render();

}


function syncDraftItems(){

  if(!state.draft)
    return;


  const rows=
    document.querySelectorAll(
      ".item-row"
    );


  if(!rows.length)
    return;


  const items=[];


  rows.forEach(
    row=>{

      const name=
        row.querySelector(
          ".it-name"
        ).value.trim();

      const qty=
        Number(
          row.querySelector(
            ".it-qty"
          ).value
        )||0;

      const price=
        Number(
          row.querySelector(
            ".it-price"
          ).value
        )||0;


      items.push({

        name,
        qty,
        price

      });

    }
  );


  state.draft.items=items;

}


/* ============================================================
   SUBMIT ORDER
============================================================ */

function submitOrder(){

  if(!state.draft){

    state.draft=
      newDraft(
        state.orderType
      );

  }


  syncDraftItems();


  const name=
    document.getElementById(
      "f_name"
    ).value.trim();

  const phone=
    document.getElementById(
      "f_phone"
    ).value.trim();


  if(!name){

    showToast(
      "أدخل اسم العميل أو المورد"
    );

    return;

  }


  if(!phone){

    showToast(
      "أدخل رقم التليفون"
    );

    return;

  }


  const items=
    state.draft.items.filter(
      i=>i.name
    );


  if(!items.length){

    showToast(
      "أدخل صنف واحد على الأقل"
    );

    return;

  }


  const invalid=
    items.some(
      i=>
        Number(i.qty)<=0 ||
        Number(i.price)<0
    );


  if(invalid){

    showToast(
      "راجع الكميات والأسعار"
    );

    return;

  }


  const d=state.draft;


  d.partyName=name;

  d.phone=phone;

  d.address=
    document.getElementById(
      "f_address"
    ).value.trim();

  d.taxInvoice=
    document.getElementById(
      "f_tax"
    ).value==="1";

  d.paymentMethod=
    document.getElementById(
      "f_pay"
    ).value;

  d.items=items;

  d.shippingCost=0;

  d.finalTotal=0;

  d.stage="logistics_review";

  d.createdAt=
    d.createdAt||todayISO();


  DATA.orders.unshift(d);


  DATA.parties=
    DATA.parties||[];


  if(
    !DATA.parties.some(
      p=>p.name===name
    )
  ){

    DATA.parties.push({

      id:uid("P"),
      name,
      phone,
      type:
        d.type==="sale"
        ?"عميل"
        :"مورد",
      address:d.address

    });

  }


  saveData();

  showToast(
    "تم حفظ الأمر وتحويله لقسم النقل"
  );


  state.view="dashboard";

  state.draft=null;

  render();

}


/* ============================================================
   OPEN ORDER
============================================================ */

function openOrder(id){

  state.selectedOrderId=id;

  state.view="detail";

  render();

}

   START
============================================================ */

loadData();
