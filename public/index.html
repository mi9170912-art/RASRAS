<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RASRAS ERP | نظام الإدارة الشامل</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --pine:#0e6b3d;
  --pine-deep:#094d2b;
  --pine-mist:#eef6ef;
  --pine-line:#cfe6d6;
  --graphite:#1b2420;
  --ink:#20281f;
  --muted:#75806f;
  --faint:#9aa397;
  --resin:#f6f4ec;
  --paper:#fffefb;
  --line:#e6e2d3;
  --line-soft:#efece1;
  --amber:#b5761b;
  --amber-bg:#fbf1de;
  --amber-line:#eddcb3;
  --clay:#a83a2c;
  --clay-bg:#fbeeeb;
  --clay-line:#f0d2ca;
  --steel:#2f6690;
  --steel-bg:#eaf3f8;
  --steel-line:#d0e4ee;
  --plum:#5e4a80;
  --plum-bg:#f2eef8;
  --plum-line:#ddd2ec;
  --rose:#9c3f63;
  --rose-bg:#fbeef3;
  --rose-line:#f0d5e1;
  --shadow:0 1px 2px rgba(27,36,32,.04),0 8px 24px rgba(27,36,32,.05);
  --shadow-lift:0 4px 10px rgba(27,36,32,.06),0 20px 40px rgba(27,36,32,.09);
  --radius:16px;
  --radius-sm:11px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:'Cairo',sans-serif;
  background:var(--resin);
  background-image:
    radial-gradient(circle at 3px 3px, rgba(27,36,32,.05) 1.4px, transparent 1.4px);
  background-size:26px 26px;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  letter-spacing:0;
}

button,input,select,textarea{
  font-family:inherit;
}

button{cursor:pointer}

.app{
  max-width:1180px;
  margin:auto;
  padding:16px 16px 90px;
}

/* =========================
   LOGIN
========================= */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  position:relative;
}

.login-card{
  width:100%;
  max-width:420px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:22px;
  padding:0;
  box-shadow:var(--shadow-lift);
  text-align:center;
  overflow:hidden;
}

.login-top{
  background:var(--graphite);
  padding:36px 32px 30px;
  position:relative;
}

.login-top:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 85% -10%, rgba(14,107,61,.55), transparent 55%);
}

.login-logo{
  width:92px;
  height:92px;
  object-fit:contain;
  border-radius:18px;
  background:#fff;
  padding:6px;
  position:relative;
  box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.login-card h1{
  margin:16px 0 0;
  font-size:22px;
  font-weight:900;
  color:#fff;
  position:relative;
  letter-spacing:.5px;
}

.login-card .subtitle{
  margin:6px 0 0;
  color:#bcd9c7;
  font-size:12px;
  font-weight:600;
  position:relative;
}

.login-bottom{
  padding:28px 30px 30px;
  text-align:right;
}

.login-footer{
  color:var(--faint);
  font-size:10.5px;
  margin-top:18px;
  text-align:center;
}

/* =========================
   HEADER
========================= */

.header{
  background:var(--graphite);
  border:1px solid var(--graphite);
  border-radius:20px;
  padding:13px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  box-shadow:var(--shadow);
  margin-bottom:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-logo{
  width:46px;
  height:46px;
  object-fit:contain;
  border-radius:11px;
  background:#fff;
  padding:3px;
}

.brand h1{
  margin:0;
  font-size:17px;
  font-weight:900;
  color:#fff;
  letter-spacing:.3px;
}

.brand p{
  margin:1px 0 0;
  font-size:10.5px;
  color:#8fcaa5;
  font-weight:700;
}

.user-area{
  display:flex;
  align-items:center;
  gap:8px;
}

.user-badge{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  color:#e7f3ea;
  border-radius:30px;
  padding:7px 13px;
  font-size:11.5px;
  font-weight:700;
}

.logout-btn{
  background:rgba(168,58,44,.16);
  color:#f2a99c;
  border:1px solid rgba(168,58,44,.35);
  border-radius:11px;
  padding:8px 13px;
  font-size:11.5px;
  font-weight:800;
}

/* =========================
   NAV
========================= */

.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:5px;
  margin-bottom:12px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:15px;
}

.tab{
  flex:0 0 auto;
  background:transparent;
  border:none;
  color:var(--muted);
  border-radius:10px;
  padding:9px 14px;
  font-size:12px;
  font-weight:800;
  transition:.15s;
}

.tab:hover{
  color:var(--pine-deep);
  background:var(--pine-mist);
}

.tab.active{
  background:var(--pine);
  color:#fff;
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:18px;
  height:18px;
  border-radius:20px;
  background:var(--clay);
  color:#fff;
  font-size:10px;
  font-weight:800;
  margin-right:4px;
  padding:0 5px;
}

/* =========================
   CARDS
========================= */

.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}

.card-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
  padding-bottom:14px;
  border-bottom:1px solid var(--line-soft);
}

.card-title h2,
.card-title h3{
  margin:0;
  color:var(--graphite);
  font-weight:900;
}

.card-title h2{font-size:17px}
.card-title h3{font-size:14.5px}

.card-title p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
}

/* =========================
   STATS
========================= */

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:14px;
}

.stat{
  position:relative;
  background:var(--paper);
  border:1px solid var(--line);
  border-right:3px solid var(--pine);
  border-radius:var(--radius-sm);
  padding:15px 16px;
  box-shadow:var(--shadow);
}

.stat.c-amber{border-right-color:var(--amber)}
.stat.c-steel{border-right-color:var(--steel)}
.stat.c-clay{border-right-color:var(--clay)}

.stat-icon{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--pine);
  margin-bottom:10px;
}

.stat.c-amber .stat-icon{color:var(--amber)}
.stat.c-steel .stat-icon{color:var(--steel)}
.stat.c-clay .stat-icon{color:var(--clay)}

.stat-icon svg{width:22px;height:22px}

.stat b{
  display:block;
  font-size:22px;
  font-weight:900;
  color:var(--graphite);
  line-height:1.2;
}

.stat span{
  font-size:10.5px;
  color:var(--muted);
  font-weight:700;
}

/* =========================
   FORMS
========================= */

label{
  display:block;
  margin:14px 0 6px;
  font-size:11.5px;
  font-weight:800;
  color:var(--graphite);
}

label:first-child{
  margin-top:0;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:var(--resin);
  color:var(--ink);
  outline:none;
  padding:11px 13px;
  font-size:13px;
  transition:.15s;
}

textarea{
  resize:vertical;
  min-height:90px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--pine);
  box-shadow:0 0 0 3px rgba(14,107,61,.1);
  background:#fff;
}

.row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.row3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

/* =========================
   BUTTONS
========================= */

.btn-primary,
.btn-secondary,
.btn-danger,
.btn-warning,
.btn-blue{
  border-radius:var(--radius-sm);
  padding:12px 16px;
  border:none;
  font-size:13px;
  font-weight:800;
  transition:.15s;
}

.btn-primary{
  width:100%;
  margin-top:15px;
  background:var(--pine);
  color:#fff;
}

.btn-primary:hover{
  background:var(--pine-deep);
}

.btn-secondary{
  background:var(--paper);
  border:1px solid var(--line);
  color:var(--ink);
}

.btn-secondary:hover{
  border-color:var(--pine);
  color:var(--pine-deep);
}

.btn-danger{
  background:var(--clay-bg);
  color:var(--clay);
  border:1px solid var(--clay-line);
}

.btn-warning{
  background:var(--amber-bg);
  color:var(--amber);
  border:1px solid var(--amber-line);
}

.btn-blue{
  background:var(--steel-bg);
  color:var(--steel);
  border:1px solid var(--steel-line);
}

/* =========================
   SEGMENT
========================= */

.seg{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.seg-btn{
  flex:1;
  border:1px solid var(--line);
  background:var(--paper);
  border-radius:var(--radius-sm);
  padding:12px;
  font-size:13px;
  font-weight:900;
  color:var(--muted);
}

.seg-btn.active{
  background:var(--graphite);
  border-color:var(--graphite);
  color:#fff;
}

/* =========================
   ORDERS
========================= */

.order-item{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px 16px;
  margin-bottom:8px;
  cursor:pointer;
  transition:.15s;
  border-right:3px solid var(--line);
}

.order-item:hover{
  border-color:var(--pine-line);
  border-right-color:var(--pine);
  background:var(--pine-mist);
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.order-id{
  font-size:10.5px;
  color:var(--muted);
  font-weight:800;
}

.order-name{
  font-size:14.5px;
  font-weight:900;
  color:var(--graphite);
  margin-top:3px;
}

.order-meta{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
  font-weight:600;
}

.order-meta b{
  color:var(--pine-deep);
  font-weight:800;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 11px 5px 9px;
  border-radius:30px;
  white-space:nowrap;
  font-size:10px;
  font-weight:800;
}

.pill:before{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:currentColor;
  flex:0 0 auto;
}

.stage-sales_created{ background:#f1f0eb; color:#6b756c; }
.stage-manager_approval{ background:var(--plum-bg); color:var(--plum); }
.stage-logistics_review{ background:var(--amber-bg); color:var(--amber); }
.stage-accounts_approval{ background:var(--steel-bg); color:var(--steel); }
.stage-warehouse_release{ background:var(--rose-bg); color:var(--rose); }
.stage-with_driver{ background:var(--amber-bg); color:#8a5a12; }
.stage-delivered{ background:var(--pine-mist); color:var(--pine-deep); }
.stage-tax_pending{ background:var(--clay-bg); color:var(--clay); }
.stage-completed{ background:var(--pine-mist); color:var(--pine-deep); }
.stage-rejected{ background:var(--clay-bg); color:var(--clay); }

/* =========================
   ITEMS
========================= */

.item-header{
  display:grid;
  grid-template-columns:1fr 100px 110px 38px;
  gap:8px;
  padding:0 2px 6px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}

.item-row{
  display:grid;
  grid-template-columns:1fr 100px 110px 38px;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}

.item-row input{
  padding:9px 10px;
}

.rm-btn{
  width:38px;
  height:38px;
  border-radius:var(--radius-sm);
  border:1px solid var(--clay-line);
  background:var(--clay-bg);
  color:var(--clay);
  font-size:19px;
  font-weight:700;
}

.add-item{
  width:100%;
  padding:11px;
  margin-top:5px;
  border:1.5px dashed var(--pine-line);
  background:var(--pine-mist);
  color:var(--pine-deep);
  border-radius:var(--radius-sm);
  font-size:12px;
  font-weight:900;
}

.total-box{
  margin-top:15px;
  padding-top:14px;
  border-top:1px solid var(--line-soft);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.total-box span{
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}

.total-box b{
  color:var(--pine-deep);
  font-size:19px;
}

/* =========================
   ALERT
========================= */

.alert{
  border-radius:13px;
  padding:13px 15px;
  margin-bottom:14px;
  font-size:12px;
  font-weight:700;
  line-height:1.7;
}

.alert-green{ background:var(--pine-mist); color:var(--pine-deep); border:1px solid var(--pine-line); }
.alert-yellow{ background:var(--amber-bg); color:#8a5a12; border:1px solid var(--amber-line); }
.alert-red{ background:var(--clay-bg); color:#8c2c20; border:1px solid var(--clay-line); }
.alert-blue{ background:var(--steel-bg); color:#215270; border:1px solid var(--steel-line); }

/* =========================
   APPROVAL FLOW
========================= */

.flow{
  display:flex;
  align-items:center;
  overflow:auto;
  padding:5px 0 15px;
  margin-bottom:5px;
}

.flow-step{
  min-width:120px;
  text-align:center;
  position:relative;
}

.flow-step:not(:last-child):after{
  content:"";
  position:absolute;
  top:16px;
  right:-50%;
  width:100%;
  height:2px;
  background:var(--line);
  z-index:0;
}

.flow-step.done:not(:last-child):after{
  background:var(--pine-line);
}

.flow-dot{
  position:relative;
  z-index:1;
  margin:auto;
  width:32px;
  height:32px;
  border-radius:9px;
  background:var(--resin);
  color:var(--faint);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:900;
  border:3px solid var(--paper);
}

.flow-step.active .flow-dot{
  background:var(--graphite);
  color:#fff;
}

.flow-step.done .flow-dot{
  background:var(--pine);
  color:#fff;
}

.flow-label{
  margin-top:6px;
  color:var(--faint);
  font-size:9px;
  font-weight:800;
}

.flow-step.active .flow-label{
  color:var(--graphite);
}

.flow-step.done .flow-label{
  color:var(--pine-deep);
}

/* =========================
   TABLES
========================= */

.table-wrap{
  overflow:auto;
}

.report-table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  min-width:700px;
  font-size:11px;
}

.report-table th{
  background:var(--resin);
  color:var(--graphite);
  font-weight:900;
  font-size:10.5px;
}

.report-table th,
.report-table td{
  border-bottom:1px solid var(--line-soft);
  padding:11px 9px;
  text-align:center;
}

.report-table tbody tr:hover{
  background:var(--pine-mist);
}

/* =========================
   MINI CHARTS
========================= */

.chart-card .card-title{margin-bottom:18px}

.bars-vertical{
  display:flex;
  align-items:flex-end;
  gap:10px;
  height:170px;
  padding:0 4px;
}

.bars-vertical .bcol{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  height:100%;
  gap:6px;
}

.bars-vertical .bval{
  font-size:9.5px;
  font-weight:800;
  color:var(--muted);
  white-space:nowrap;
}

.bars-vertical .bbar{
  width:100%;
  max-width:34px;
  border-radius:6px 6px 3px 3px;
  background:linear-gradient(180deg,var(--pine),var(--pine-deep));
  min-height:4px;
}

.bars-vertical .blabel{
  font-size:9.5px;
  color:var(--muted);
  font-weight:700;
  margin-top:2px;
}

.hbar-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.hbar-row:last-child{margin-bottom:0}

.hbar-label{
  width:118px;
  flex:0 0 auto;
  font-size:11.5px;
  font-weight:800;
  color:var(--graphite);
  display:flex;
  align-items:center;
  gap:6px;
}

.hbar-label:before{
  content:"";
  width:8px;
  height:8px;
  border-radius:3px;
  background:var(--dot,var(--pine));
  flex:0 0 auto;
}

.hbar-track{
  flex:1;
  height:10px;
  background:var(--resin);
  border-radius:20px;
  overflow:hidden;
}

.hbar-fill{
  height:100%;
  border-radius:20px;
  background:var(--dot,var(--pine));
}

.hbar-val{
  width:80px;
  flex:0 0 auto;
  text-align:left;
  font-size:11px;
  font-weight:800;
  color:var(--muted);
}

.rank-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid var(--line-soft);
}

.rank-row:last-child{border-bottom:none}

.rank-num{
  width:26px;
  height:26px;
  border-radius:8px;
  background:var(--pine-mist);
  color:var(--pine-deep);
  font-size:11px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
}

.rank-info{flex:1;min-width:0}

.rank-name{
  font-size:12.5px;
  font-weight:800;
  color:var(--graphite);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.rank-sub{
  font-size:10.5px;
  color:var(--muted);
  font-weight:600;
}

.rank-value{
  font-size:13px;
  font-weight:900;
  color:var(--pine-deep);
  flex:0 0 auto;
}

/* =========================
   TRIPS / SETTLEMENT
========================= */

.trip-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 4px;
  border-bottom:1px solid var(--line-soft);
}

.trip-row:last-child{border-bottom:none}

.trip-check{
  width:19px;
  height:19px;
  flex:0 0 auto;
  accent-color:var(--pine);
}

.trip-info{flex:1;min-width:0}

.trip-title{
  font-size:12.5px;
  font-weight:800;
  color:var(--graphite);
}

.trip-sub{
  font-size:10.5px;
  color:var(--muted);
  font-weight:600;
  margin-top:2px;
}

.trip-cost{
  font-size:13px;
  font-weight:900;
  color:var(--pine-deep);
  flex:0 0 auto;
  white-space:nowrap;
}

.settle-summary{
  background:var(--resin);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  margin-top:16px;
}

.settle-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 0;
  font-size:12.5px;
  font-weight:700;
  color:var(--ink);
}

.settle-row b{font-weight:900}

.settle-row.total{
  border-top:1px dashed var(--line);
  margin-top:6px;
  padding-top:12px;
  font-size:14.5px;
}

.balance-tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 14px;
  border-radius:30px;
  font-size:12px;
  font-weight:900;
}

.balance-tag.credit{background:var(--amber-bg);color:var(--amber)}
.balance-tag.debit{background:var(--steel-bg);color:var(--steel)}
.balance-tag.settled{background:var(--pine-mist);color:var(--pine-deep)}

.settlement-item{
  background:var(--paper);
  border:1px solid var(--line);
  border-right:3px solid var(--pine);
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:9px;
}

.settlement-item.c-amber{border-right-color:var(--amber)}
.settlement-item.c-steel{border-right-color:var(--steel)}

.settlement-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

.empty-icon{
  margin:0 auto 10px;
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--faint);
}

.empty-icon svg{width:32px;height:32px}

.empty b{
  display:block;
  color:var(--graphite);
  font-size:14px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:50%;
  bottom:25px;
  transform:translateX(50%) translateY(20px);
  background:var(--graphite);
  color:#fff;
  border-radius:30px;
  padding:11px 21px;
  font-size:12px;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:9999;
  box-shadow:var(--shadow-lift);
}

.toast.show{
  opacity:1;
  transform:translateX(50%) translateY(0);
}

/* =========================
   PRINT
========================= */

#printArea{
  display:none;
}

@media print{
  body *{
    visibility:hidden!important;
  }

  #printArea,
  #printArea *{
    visibility:visible!important;
  }

  #printArea{
    display:block!important;
    position:absolute;
    right:0;
    top:0;
    width:100%;
    padding:20px 25px;
    background:#fff;
  }

  .print-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:3px solid #1b2420;
    padding-bottom:16px;
    margin-bottom:18px;
  }

  .print-header img{
    height:56px;
    border-radius:10px;
  }

  .print-header .ph-brand{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .print-header h1{
    margin:0;
    font-size:18px;
  }

  .print-header .ph-meta{
    text-align:left;
    font-size:11px;
    color:#555;
  }

  .print-kpis{
    display:flex;
    gap:10px;
    margin-bottom:18px;
  }

  .print-kpi{
    flex:1;
    border:1px solid #ccc;
    border-radius:8px;
    padding:10px;
    text-align:center;
  }

  .print-kpi b{
    display:block;
    font-size:15px;
  }

  .print-kpi span{
    font-size:9.5px;
    color:#666;
  }

  .print-section-title{
    font-size:13px;
    font-weight:900;
    margin:18px 0 8px;
    border-right:3px solid #0e6b3d;
    padding-right:8px;
  }

  .print-table{
    width:100%;
    border-collapse:collapse;
    margin-top:6px;
  }

  .print-table th,
  .print-table td{
    border:1px solid #222;
    padding:8px;
    text-align:center;
    font-size:11px;
  }

  .print-footer{
    margin-top:24px;
    padding-top:10px;
    border-top:1px solid #ccc;
    font-size:9.5px;
    color:#777;
    text-align:center;
  }

  .print-docnum{
    display:inline-block;
    border:2px solid #1b2420;
    border-radius:8px;
    padding:6px 14px;
    font-size:13px;
    font-weight:900;
    margin-bottom:4px;
  }

  .print-signatures{
    display:flex;
    justify-content:space-between;
    gap:20px;
    margin-top:60px;
  }

  .print-signatures div{
    flex:1;
    text-align:center;
    border-top:1px solid #333;
    padding-top:8px;
    font-size:11px;
    color:#333;
  }

  .print-balance{
    margin-top:16px;
    border:2px solid #1b2420;
    border-radius:10px;
    padding:14px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
    font-weight:900;
  }
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){
  .stat-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .header{
    align-items:flex-start;
  }

  .user-area{
    flex-direction:column;
    align-items:flex-end;
  }
}

@media(max-width:560px){
  .app{
    padding:10px 10px 70px;
  }

  .header{
    padding:11px;
    border-radius:16px;
  }

  .brand-logo{
    width:40px;
    height:40px;
  }

  .brand h1{
    font-size:14.5px;
  }

  .brand p{
    font-size:9px;
  }

  .user-badge{
    max-width:130px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .stat-grid{
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .stat{
    padding:12px;
  }

  .stat b{
    font-size:18px;
  }

  .row2,
  .row3{
    grid-template-columns:1fr;
  }

  .item-header,
  .item-row{
    grid-template-columns:1fr 70px 85px 34px;
  }

  .card{
    padding:15px;
    border-radius:15px;
  }

  .order-top{
    flex-direction:column;
  }

  .flow-step{
    min-width:104px;
  }

  .hbar-label{
    width:88px;
    font-size:10.5px;
  }

  .hbar-val{
    width:64px;
    font-size:10px;
  }
}

      {id: 'transport', name: 'حسابات النقل وكشف الحساب'},
      {id: 'tax_invoices', name: 'الفواتير الضريبية'},
      {id: 'reports', name: 'التقارير المالية'}
    ];
  } else if(currentUser.role === 'warehouse') {
    tabs = [
      {id: 'dashboard', name: 'اللوحة الرئيسية'},
      {id: 'warehouse_panel', name: 'المخزن وأذونات الاستلام والصرف', badge: db.salesOrders.filter(o => o.stage === 'warehouse_release').length + db.purchaseOrders.filter(o => o.stage === 'warehouse_receive').length}
    ];
  }

  // Default active tab
  if(!window.currentTab || !tabs.some(t => t.id === window.currentTab)) {
    window.currentTab = tabs[0].id;
  }

  app.innerHTML = `
    <div class="header">
      <div class="brand">
        <img src="${LOGO_SRC}" class="brand-logo" alt="Logo">
        <div>
          <h1>RASRAS ERP</h1>
          <p>النظام المتكامل لإدارة المصنع</p>
        </div>
      </div>
      <div class="user-area">
        <div class="user-badge">${currentUser.name} (${currentUser.role})</div>
        <button class="logout-btn" onclick="logout()">خروج</button>
      </div>
    </div>

    <div class="tabs">
      ${tabs.map(t => `
        <button class="tab ${window.currentTab === t.id ? 'active' : ''}" onclick="switchTab('${t.id}')">
          ${t.badge ? `<span class="badge">${t.badge}</span>` : ''}
          ${t.name}
        </button>
      `).join('')}
    </div>

    <div id="tabContent"></div>
  `;

  renderTabContent();
}

function handleLogin(e) {
  e.preventDefault();
  const uVal = document.getElementById('loginUser').value;
  const found = db.users.find(u => u.user === uVal);
  if(found) {
    currentUser = found;
    window.currentTab = 'dashboard';
    saveDB();
    renderApp();
    showToast('مرحباً بك يا ' + found.name);
  }
}

function logout() {
  currentUser = null;
  window.currentTab = null;
  renderApp();
  showToast تم بنجاح;
}

function switchTab(id) {
  window.currentTab = id;
  renderApp();
}

// Render Tab Content
function renderTabContent() {
  const container = document.getElementById('tabContent');
  if(!container) return;

  if(window.currentTab === 'dashboard') {
    container.innerHTML = renderDashboard();
  } else if(window.currentTab === 'sales_orders') {
    container.innerHTML = renderSalesOrders();
  } else if(window.currentTab === 'purchase_orders') {
    container.innerHTML = renderPurchaseOrders();
  } else if(window.currentTab === 'external_orders') {
    container.innerHTML = renderExternalOrders();
  } else if(window.currentTab === 'approvals') {
    container.innerHTML = renderApprovals();
  } else if(window.currentTab === 'transport') {
    container.innerHTML = renderTransportAndAccounts();
  } else if(window.currentTab === 'accounts_panel') {
    container.innerHTML = renderAccountsPanel();
  } else if(window.currentTab === 'warehouse_panel') {
    container.innerHTML = renderWarehousePanel();
  } else if(window.currentTab === 'tax_invoices') {
    container.innerHTML = renderTaxInvoices();
  } else if(window.currentTab === 'reports') {
    container.innerHTML = renderProfessionalReports();
  }
}

function addSOItemRow() {
  const container = document.getElementById('soItemsContainer');
  const div = document.createElement('div');
  div.className = 'item-row';
  div.innerHTML = `
    <select class="item-name" required>
      ${db.productsList.map(p => `<option value="${p}">${p}</option>`).join('')}
    </select>
    <input type="number" class="item-qty" placeholder="الكمية" value="100" min="1" oninput="calcSOMerge()">
    <input type="number" class="item-price" placeholder="السعر" value="10" min="0" oninput="calcSOMerge()">
    <button type="button" class="rm-btn" onclick="this.parentElement.remove(); calcSOMerge();">×</button>
  `;
  container.appendChild(div);
  calcSOMerge();
}

function calcSOMerge() {
  let total = 0;
  document.querySelectorAll('#soItemsContainer .item-row').forEach(row => {
    const q = parseFloat(row.querySelector('.item-qty').value) || 0;
    const p = parseFloat(row.querySelector('.item-price').value) || 0;
    total += q * p;
  });
  const prev = document.getElementById('soTotalPreview');
  if(prev) prev.innerText = total.toLocaleString() + ' ج.م';
}

function submitSalesOrder(e) {
  e.preventDefault();
  const clientName = document.getElementById('soClient').value;
  const clientPhone = document.getElementById('soPhone').value;
  const clientTaxId = document.getElementById('soTaxId').value;

  let items = [];
  let total = 0;
  document.querySelectorAll('#soItemsContainer .item-row').forEach(row => {
    const name = row.querySelector('.item-name').value;
    const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
    const price = parseFloat(row.querySelector('.item-price').value) || 0;
    items.push({name, qty, price});
    total += qty * price;
  });

  const newId = 'SO-' + (1000 + db.salesOrders.length + 1);
  const newOrder = {
    id: newId,
    clientName,
    clientPhone,
    clientTaxId,
    items,
    total,
    stage: 'manager_approval',
    history: [
      {stage: 'إنشاء أمر البيع', by: currentUser.name, date: new Date().toISOString().split('T')[0]}
    ]
  };

  db.salesOrders.unshift(newOrder);
  saveDB();
  closeModal();
  renderApp();
  showToast('تم إنشاء أمر البيع بنجاح');
}

function closeModal() {
  const m = document.getElementById('customModal');
  if(m) m.remove();
}

function renderExternalStagePill(stage) {

function addExtItemRow() {
  const container = document.getElementById('extItemsContainer');
  const div = document.createElement('div');
  div.className = 'item-row';
  div.style.gridTemplateColumns = '1fr 80px 90px 90px 38px';
  div.innerHTML = `
    <select class="item-name" required>
      ${db.productsList.map(p => `<option value="${p}">${p}</option>`).join('')}
    </select>
    <input type="number" class="item-qty" value="100" min="1" oninput="calcExtMerge()">
    <input type="number" class="item-cost" value="20" min="0" oninput="calcExtMerge()">
    <input type="number" class="item-sale" value="30" min="0" oninput="calcExtMerge()">
    <button type="button" class="rm-btn" onclick="this.parentElement.remove(); calcExtMerge();">×</button>
  `;
  container.appendChild(div);
  calcExtMerge();
}

function calcExtMerge() {
  let totalC = 0;
  let totalS = 0;
  document.querySelectorAll('#extItemsContainer .item-row').forEach(row => {
    const q = parseFloat(row.querySelector('.item-qty').value) || 0;
    const c = parseFloat(row.querySelector('.item-cost').value) || 0;
    const s = parseFloat(row.querySelector('.item-sale').value) || 0;
    totalC += q * c;
    totalS += q * s;
  });
  document.getElementById('extCostPreview').innerText = totalC.toLocaleString() + ' ج.م';
  document.getElementById('extSalePreview').innerText = totalS.toLocaleString() + ' ج.م';
  document.getElementById('extProfitPreview').innerText = (totalS - totalC).toLocaleString() + ' ج.م';
}

function submitExternalOrder(e) {
  e.preventDefault();
  const supplierName = document.getElementById('extSupplier').value;
  const clientName = document.getElementById('extClient').value;

  let items = [];
  let totalCost = 0;
  let totalSale = 0;
  document.querySelectorAll('#extItemsContainer .item-row').forEach(row => {
    const name = row.querySelector('.item-name').value;
    const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
    const cost = parseFloat(row.querySelector('.item-cost').value) || 0;
    const sale = parseFloat(row.querySelector('.item-sale').value) || 0;
    items.push({name, qty, cost, sale});
    totalCost += qty * cost;
    totalSale += qty * sale;
  });

  const newId = 'EXT-' + (3000 + db.externalOrders.length + 1);
  const newOrder = {
    id: newId,
    supplierName,
    clientName,
    items,
    totalCost,
    totalSale,
    stage: 'completed', // مباشر ومعتمد
    history: [
      {stage: 'إنشاء أمر شراء وبيع خارجي واعتماده', by: currentUser.name, date: new Date().toISOString().split('T')[0]}
    ]
  };

  db.externalOrders.unshift(newOrder);
  saveDB();
  closeModal();
  renderApp();
  showToast('تم اعتماد أمر الشراء والبيع الخارجي بنجاح');
}

function renderFlowSteps(stage) {
  const steps = [
    {key: 'sales_created', label: 'الإنشاء'},
    {key: 'manager_approval', label: 'مدير عام'},
    {key: 'logistics_review', label: 'النقل'},
    {key: 'accounts_approval', label: 'الحسابات'},
    {key: 'warehouse_release', label: 'المخزن'},
    {key: 'with_driver', label: 'التوصيل'},
    {key: 'completed', label: 'مكتمل'}
  ];
  let foundActive = false;
  return steps.map((s, idx) => {
    let cls = 'flow-step ';
    if(stage === s.key || (stage === 'tax_pending' && s.key === 'completed')) cls += 'active';
    else if(!foundActive) cls += 'done';
    if(stage === s.key) foundActive = true;
    return `
      <div class="${cls}">
        <div class="flow-dot">${idx+1}</div>
        <div class="flow-label">${s.label}</div>
      </div>
    `;
  }).join('');
}

    driversMap[dName].totalCost += (o.transport.cost || 0);

function handleLogisticsSubmit(e, orderId) {
  e.preventDefault();
  const driverName = document.getElementById('logDriver').value;
  const carNumber = document.getElementById('logCar').value;
  const destination = document.getElementById('logDest').value;
  const cost = parseFloat(document.getElementById('logCost').value) || 0;

  const o = db.salesOrders.find(x => x.id === orderId);
  if(o) {
    o.transport = {
      driverName,
      carNumber,
      destination,
      cost,
      paid: 0 // يبدأ الرصيد غير مدفوع حتى يسدده قسم الحسابات

    o.history.push({stage: 'تسجيل بيانات النقل وتحديد التكلفة', by: currentUser.name, date: new Date().toISOString().split('T')[0]});
    saveDB();
    closeModal();

}

function handleAccountPayTransport(e) {
  e.preventDefault();
  const driverName = document.getElementById('payDriverName').value;
  const amount = parseFloat(document.getElementById('payAmount').value) || 0;
  const notes = document.getElementById('payNotes').value;

  // Find orders for this driver that have remaining transport cost
  let remainingToPay = amount;
  db.salesOrders.forEach(o => {
    if(o.transport && o.transport.driverName === driverName && remainingToPay > 0) {
      let orderRem = (o.transport.cost || 0) - (o.transport.paid || 0);
      if(orderRem > 0) {
        let payNow = Math.min(orderRem, remainingToPay);
        o.transport.paid += payNow;
        remainingToPay -= payNow;
      }
    }
  });

  db.transportPayments.push({
    id: 'TR-' + (500 + db.transportPayments.length + 1),
    driverName,
    tripId: 'متعدد / تسوية',
    totalCost: amount,
    paidAmount: amount,
    remaining: 0,
    date: new Date().toISOString().split('T')[0],
    notes: notes || 'سداد من قسم الحسابات'
  });

  saveDB();
  renderApp();
  showToast('تم تسجيل سداد مبلغ ' + amount.toLocaleString() + ' ج.م بنجاح وتحديث حساب السائق');
}

    ${o.transport ? `
      <div style="margin-top:15px;font-size:11.5px">
        <b>بيانات النقل والشحن:</b> السائق: ${o.transport.driverName} | السيارة: ${o.transport.carNumber} | الوجهة: ${o.transport.destination} | تكلفة النقل: ${o.transport.cost} ج.م (المدفوع: ${o.transport.paid} ج.م)
      </div>
    ` : ''}

    <div class="print-balance">
      <span>إجمالي الفاتورة النهائية:</span>
      <span>${o.total.toLocaleString()} ج.م</span>
    </div>

    <div class="print-signatures">
      <div>توقيع المسؤول</div>
      <div>ختم الشركة / المبيعات</div>
      <div>استلام العميل</div>
    </div>

    <div class="print-footer">
      جميع الحقوق محفوظة © 2026 RASRAS PLASTIC - نظام ERP المتطور
    </div>
  `;
  window.print();
}

// Initial render call
renderApp();

</script>
</body>
</html>
