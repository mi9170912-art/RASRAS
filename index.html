<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RASRAS ERP | نظام إدارة أوامر البيع</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --pine:#0e6b3d;
  --pine-deep:#094d2b;
  --pine-mist:#eef6ef;
  --pine-line:#cfe6d6;
  --graphite:#1b2420;
  --ink:#20281f;
  --muted:#75806f;
  --faint:#9aa397;
  --resin:#f6f4ec;
  --paper:#fffefb;
  --line:#e6e2d3;
  --line-soft:#efece1;
  --amber:#b5761b;
  --amber-bg:#fbf1de;
  --amber-line:#eddcb3;
  --clay:#a83a2c;
  --clay-bg:#fbeeeb;
  --clay-line:#f0d2ca;
  --steel:#2f6690;
  --steel-bg:#eaf3f8;
  --steel-line:#d0e4ee;
  --plum:#5e4a80;
  --plum-bg:#f2eef8;
  --plum-line:#ddd2ec;
  --rose:#9c3f63;
  --rose-bg:#fbeef3;
  --rose-line:#f0d5e1;
  --shadow:0 1px 2px rgba(27,36,32,.04),0 8px 24px rgba(27,36,32,.05);
  --shadow-lift:0 4px 10px rgba(27,36,32,.06),0 20px 40px rgba(27,36,32,.09);
  --radius:16px;
  --radius-sm:11px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:'Cairo',sans-serif;
  background:var(--resin);
  background-image:
    radial-gradient(circle at 3px 3px, rgba(27,36,32,.05) 1.4px, transparent 1.4px);
  background-size:26px 26px;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  letter-spacing:0;
}

button,input,select,textarea{
  font-family:inherit;
}

button{cursor:pointer}

.app{
  max-width:1180px;
  margin:auto;
  padding:16px 16px 90px;
}

/* =========================
   LOGIN
========================= */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  position:relative;
}

.login-card{
  width:100%;
  max-width:420px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:22px;
  padding:0;
  box-shadow:var(--shadow-lift);
  text-align:center;
  overflow:hidden;
}

.login-top{
  background:var(--graphite);
  padding:36px 32px 30px;
  position:relative;
}

.login-top:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 85% -10%, rgba(14,107,61,.55), transparent 55%);
}

.login-logo{
  width:92px;
  height:92px;
  object-fit:contain;
  border-radius:18px;
  background:#fff;
  padding:6px;
  position:relative;
  box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.login-card h1{
  margin:16px 0 0;
  font-size:22px;
  font-weight:900;
  color:#fff;
  position:relative;
  letter-spacing:.5px;
}

.login-card .subtitle{
  margin:6px 0 0;
  color:#bcd9c7;
  font-size:12px;
  font-weight:600;
  position:relative;
}

.login-bottom{
  padding:28px 30px 30px;
  text-align:right;
}

.login-footer{
  color:var(--faint);
  font-size:10.5px;
  margin-top:18px;
  text-align:center;
}

/* =========================
   HEADER
========================= */

.header{
  background:var(--graphite);
  border:1px solid var(--graphite);
  border-radius:20px;
  padding:13px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  box-shadow:var(--shadow);
  margin-bottom:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-logo{
  width:46px;
  height:46px;
  object-fit:contain;
  border-radius:11px;
  background:#fff;
  padding:3px;
}

.brand h1{
  margin:0;
  font-size:17px;
  font-weight:900;
  color:#fff;
  letter-spacing:.3px;
}

.brand p{
  margin:1px 0 0;
  font-size:10.5px;
  color:#8fcaa5;
  font-weight:700;
}

.user-area{
  display:flex;
  align-items:center;
  gap:8px;
}

.user-badge{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  color:#e7f3ea;
  border-radius:30px;
  padding:7px 13px;
  font-size:11.5px;
  font-weight:700;
}

.sync-badge{
  border-radius:30px;
  padding:7px 12px;
  font-size:11px;
  font-weight:800;
  border:1px solid transparent;
}

.sync-badge.online{
  background:rgba(14,107,61,.18);
  border-color:rgba(14,107,61,.4);
  color:#8fcaa5;
}

.sync-badge.offline{
  background:rgba(181,118,27,.18);
  border-color:rgba(181,118,27,.4);
  color:#f0c48a;
}

.logout-btn{
  background:rgba(168,58,44,.16);
  color:#f2a99c;
  border:1px solid rgba(168,58,44,.35);
  border-radius:11px;
  padding:8px 13px;
  font-size:11.5px;
  font-weight:800;
}

/* =========================
   NAV
========================= */

.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:5px;
  margin-bottom:12px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:15px;
}

.tab{
  flex:0 0 auto;
  background:transparent;
  border:none;
  color:var(--muted);
  border-radius:10px;
  padding:9px 14px;
  font-size:12px;
  font-weight:800;
  transition:.15s;
}

.tab:hover{
  color:var(--pine-deep);
  background:var(--pine-mist);
}

.tab.active{
  background:var(--pine);
  color:#fff;
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:18px;
  height:18px;
  border-radius:20px;
  background:var(--clay);
  color:#fff;
  font-size:10px;
  font-weight:800;
  margin-right:4px;
  padding:0 5px;
}

/* =========================
   CARDS
========================= */

.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}

.card-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
  padding-bottom:14px;
  border-bottom:1px solid var(--line-soft);
}

.card-title h2,
.card-title h3{
  margin:0;
  color:var(--graphite);
  font-weight:900;
}

.card-title h2{font-size:17px}
.card-title h3{font-size:14.5px}

.card-title p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
}

/* =========================
   STATS
========================= */

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:14px;
}

.stat{
  position:relative;
  background:var(--paper);
  border:1px solid var(--line);
  border-right:3px solid var(--pine);
  border-radius:var(--radius-sm);
  padding:15px 16px;
  box-shadow:var(--shadow);
}

.stat.c-amber{border-right-color:var(--amber)}
.stat.c-steel{border-right-color:var(--steel)}
.stat.c-clay{border-right-color:var(--clay)}

.stat-icon{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--pine);
  margin-bottom:10px;
}

.stat.c-amber .stat-icon{color:var(--amber)}
.stat.c-steel .stat-icon{color:var(--steel)}
.stat.c-clay .stat-icon{color:var(--clay)}

.stat-icon svg{width:22px;height:22px}

.stat b{
  display:block;
  font-size:22px;
  font-weight:900;
  color:var(--graphite);
  line-height:1.2;
}

.stat span{
  font-size:10.5px;
  color:var(--muted);
  font-weight:700;
}

/* =========================
   FORMS
========================= */

label{
  display:block;
  margin:14px 0 6px;
  font-size:11.5px;
  font-weight:800;
  color:var(--graphite);
}

label:first-child{
  margin-top:0;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:var(--resin);
  color:var(--ink);
  outline:none;
  padding:11px 13px;
  font-size:13px;
  transition:.15s;
}

textarea{
  resize:vertical;
  min-height:90px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--pine);
  box-shadow:0 0 0 3px rgba(14,107,61,.1);
  background:#fff;
}

.row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.row3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

/* =========================
   BUTTONS
========================= */

.btn-primary,
.btn-secondary,
.btn-danger,
.btn-warning,
.btn-blue{
  border-radius:var(--radius-sm);
  padding:12px 16px;
  border:none;
  font-size:13px;
  font-weight:800;
  transition:.15s;
}

.btn-primary{
  width:100%;
  margin-top:15px;
  background:var(--pine);
  color:#fff;
}

.btn-primary:hover{
  background:var(--pine-deep);
}

.btn-secondary{
  background:var(--paper);
  border:1px solid var(--line);
  color:var(--ink);
}

.btn-secondary:hover{
  border-color:var(--pine);
  color:var(--pine-deep);
}

.btn-danger{
  background:var(--clay-bg);
  color:var(--clay);
  border:1px solid var(--clay-line);
}

.btn-warning{
  background:var(--amber-bg);
  color:var(--amber);
  border:1px solid var(--amber-line);
}

.btn-blue{
  background:var(--steel-bg);
  color:var(--steel);
  border:1px solid var(--steel-line);
}

/* =========================
   SEGMENT
========================= */

.seg{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.seg-btn{
  flex:1;
  border:1px solid var(--line);
  background:var(--paper);
  border-radius:var(--radius-sm);
  padding:12px;
  font-size:13px;
  font-weight:900;
  color:var(--muted);
}

.seg-btn.active{
  background:var(--graphite);
  border-color:var(--graphite);
  color:#fff;
}

/* =========================
   ORDERS
========================= */

.order-item{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px 16px;
  margin-bottom:8px;
  cursor:pointer;
  transition:.15s;
  border-right:3px solid var(--line);
}

.order-item:hover{
  border-color:var(--pine-line);
  border-right-color:var(--pine);
  background:var(--pine-mist);
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.order-id{
  font-size:10.5px;
  color:var(--muted);
  font-weight:800;
}

.order-name{
  font-size:14.5px;
  font-weight:900;
  color:var(--graphite);
  margin-top:3px;
}

.order-meta{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
  font-weight:600;
}

.order-meta b{
  color:var(--pine-deep);
  font-weight:800;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 11px 5px 9px;
  border-radius:30px;
  white-space:nowrap;
  font-size:10px;
  font-weight:800;
}

.pill:before{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:currentColor;
  flex:0 0 auto;
}

.stage-sales_created{ background:#f1f0eb; color:#6b756c; }
.stage-manager_approval{ background:var(--plum-bg); color:var(--plum); }
.stage-logistics_review{ background:var(--amber-bg); color:var(--amber); }
.stage-accounts_approval{ background:var(--steel-bg); color:var(--steel); }
.stage-warehouse_release{ background:var(--rose-bg); color:var(--rose); }
.stage-with_driver{ background:var(--amber-bg); color:#8a5a12; }
.stage-delivered{ background:var(--pine-mist); color:var(--pine-deep); }
.stage-tax_pending{ background:var(--clay-bg); color:var(--clay); }
.stage-completed{ background:var(--pine-mist); color:var(--pine-deep); }
.stage-rejected{ background:var(--clay-bg); color:var(--clay); }
.stage-cancelled{ background:#f1f0eb; color:#5a5248; }
.stage-warehouse_receipt{ background:var(--rose-bg); color:var(--rose); }
.stage-accounts_settlement{ background:var(--steel-bg); color:var(--steel); }

/* =========================
   ITEMS
========================= */

.item-header{
  display:grid;
  grid-template-columns:1fr 100px 110px 38px;
  gap:8px;
  padding:0 2px 6px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}

.item-row{
  display:grid;
  grid-template-columns:1fr 100px 110px 38px;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}

.item-row input{
  padding:9px 10px;
}

.item-header-5,
.item-row-5{
  grid-template-columns:1fr 65px 90px 90px 38px;
}

.rm-btn{
  width:38px;
  height:38px;
  border-radius:var(--radius-sm);
  border:1px solid var(--clay-line);
  background:var(--clay-bg);
  color:var(--clay);
  font-size:19px;
  font-weight:700;
}

.add-item{
  width:100%;
  padding:11px;
  margin-top:5px;
  border:1.5px dashed var(--pine-line);
  background:var(--pine-mist);
  color:var(--pine-deep);
  border-radius:var(--radius-sm);
  font-size:12px;
  font-weight:900;
}

.total-box{
  margin-top:15px;
  padding-top:14px;
  border-top:1px solid var(--line-soft);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.total-box span{
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}

.total-box b{
  color:var(--pine-deep);
  font-size:19px;
}

/* =========================
   ALERT
========================= */

.alert{
  border-radius:13px;
  padding:13px 15px;
  margin-bottom:14px;
  font-size:12px;
  font-weight:700;
  line-height:1.7;
}

.alert-green{ background:var(--pine-mist); color:var(--pine-deep); border:1px solid var(--pine-line); }
.alert-yellow{ background:var(--amber-bg); color:#8a5a12; border:1px solid var(--amber-line); }
.alert-red{ background:var(--clay-bg); color:#8c2c20; border:1px solid var(--clay-line); }
.alert-blue{ background:var(--steel-bg); color:#215270; border:1px solid var(--steel-line); }

/* =========================
   APPROVAL FLOW
========================= */

.flow{
  display:flex;
  align-items:center;
  overflow:auto;
  padding:5px 0 15px;
  margin-bottom:5px;
}

.flow-step{
  min-width:120px;
  text-align:center;
  position:relative;
}

.flow-step:not(:last-child):after{
  content:"";
  position:absolute;
  top:16px;
  right:-50%;
  width:100%;
  height:2px;
  background:var(--line);
  z-index:0;
}

.flow-step.done:not(:last-child):after{
  background:var(--pine-line);
}

.flow-dot{
  position:relative;
  z-index:1;
  margin:auto;
  width:32px;
  height:32px;
  border-radius:9px;
  background:var(--resin);
  color:var(--faint);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:900;
  border:3px solid var(--paper);
}

.flow-step.active .flow-dot{
  background:var(--graphite);
  color:#fff;
}

.flow-step.done .flow-dot{
  background:var(--pine);
  color:#fff;
}

.flow-label{
  margin-top:6px;
  color:var(--faint);
  font-size:9px;
  font-weight:800;
}

.flow-step.active .flow-label{
  color:var(--graphite);
}

.flow-step.done .flow-label{
  color:var(--pine-deep);
}

/* =========================
   TABLES
========================= */

.table-wrap{
  overflow:auto;
}

.report-table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  min-width:700px;
  font-size:11px;
}

.report-table th{
  background:var(--resin);
  color:var(--graphite);
  font-weight:900;
  font-size:10.5px;
}

.report-table th,
.report-table td{
  border-bottom:1px solid var(--line-soft);
  padding:11px 9px;
  text-align:center;
}

.report-table tbody tr:hover{
  background:var(--pine-mist);
}

/* =========================
   MINI CHARTS
========================= */

.chart-card .card-title{margin-bottom:18px}

.bars-vertical{
  display:flex;
  align-items:flex-end;
  gap:10px;
  height:170px;
  padding:0 4px;
}

.bars-vertical .bcol{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  height:100%;
  gap:6px;
}

.bars-vertical .bval{
  font-size:9.5px;
  font-weight:800;
  color:var(--muted);
  white-space:nowrap;
}

.bars-vertical .bbar{
  width:100%;
  max-width:34px;
  border-radius:6px 6px 3px 3px;
  background:linear-gradient(180deg,var(--pine),var(--pine-deep));
  min-height:4px;
}

.bars-vertical .blabel{
  font-size:9.5px;
  color:var(--muted);
  font-weight:700;
  margin-top:2px;
}

.hbar-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.hbar-row:last-child{margin-bottom:0}

.hbar-label{
  width:118px;
  flex:0 0 auto;
  font-size:11.5px;
  font-weight:800;
  color:var(--graphite);
  display:flex;
  align-items:center;
  gap:6px;
}

.hbar-label:before{
  content:"";
  width:8px;
  height:8px;
  border-radius:3px;
  background:var(--dot,var(--pine));
  flex:0 0 auto;
}

.hbar-track{
  flex:1;
  height:10px;
  background:var(--resin);
  border-radius:20px;
  overflow:hidden;
}

.hbar-fill{
  height:100%;
  border-radius:20px;
  background:var(--dot,var(--pine));
}

.hbar-val{
  width:80px;
  flex:0 0 auto;
  text-align:left;
  font-size:11px;
  font-weight:800;
  color:var(--muted);
}

.rank-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid var(--line-soft);
}

.rank-row:last-child{border-bottom:none}

.rank-num{
  width:26px;
  height:26px;
  border-radius:8px;
  background:var(--pine-mist);
  color:var(--pine-deep);
  font-size:11px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
}

.rank-info{flex:1;min-width:0}

.rank-name{
  font-size:12.5px;
  font-weight:800;
  color:var(--graphite);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.rank-sub{
  font-size:10.5px;
  color:var(--muted);
  font-weight:600;
}

.rank-value{
  font-size:13px;
  font-weight:900;
  color:var(--pine-deep);
  flex:0 0 auto;
}

/* =========================
   TRIPS / SETTLEMENT
========================= */

.trip-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 4px;
  border-bottom:1px solid var(--line-soft);
}

.trip-row:last-child{border-bottom:none}

.trip-check{
  width:19px;
  height:19px;
  flex:0 0 auto;
  accent-color:var(--pine);
}

.trip-info{flex:1;min-width:0}

.trip-title{
  font-size:12.5px;
  font-weight:800;
  color:var(--graphite);
}

.trip-sub{
  font-size:10.5px;
  color:var(--muted);
  font-weight:600;
  margin-top:2px;
}

.trip-cost{
  font-size:13px;
  font-weight:900;
  color:var(--pine-deep);
  flex:0 0 auto;
  white-space:nowrap;
}

.settle-summary{
  background:var(--resin);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  margin-top:16px;
}

.settle-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 0;
  font-size:12.5px;
  font-weight:700;
  color:var(--ink);
}

.settle-row b{font-weight:900}

.settle-row.total{
  border-top:1px dashed var(--line);
  margin-top:6px;
  padding-top:12px;
  font-size:14.5px;
}

.balance-tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 14px;
  border-radius:30px;
  font-size:12px;
  font-weight:900;
}

.balance-tag.credit{background:var(--amber-bg);color:var(--amber)}
.balance-tag.debit{background:var(--steel-bg);color:var(--steel)}
.balance-tag.settled{background:var(--pine-mist);color:var(--pine-deep)}

.settlement-item{
  background:var(--paper);
  border:1px solid var(--line);
  border-right:3px solid var(--pine);
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:9px;
}

.settlement-item.c-amber{border-right-color:var(--amber)}
.settlement-item.c-steel{border-right-color:var(--steel)}

.settlement-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

/* =========================
   DRIVER MESSAGE
========================= */

.driver-message{
  background:var(--resin);
  border:1px solid var(--pine-line);
  border-radius:14px;
  padding:16px;
  white-space:pre-line;
  font-size:12px;
  line-height:2;
}

.message-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.message-actions button{
  flex:1;
}

/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

.empty-icon{
  margin:0 auto 10px;
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--faint);
}

.empty-icon svg{width:32px;height:32px}

.empty b{
  display:block;
  color:var(--graphite);
  font-size:14px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:50%;
  bottom:25px;
  transform:translateX(50%) translateY(20px);
  background:var(--graphite);
  color:#fff;
  border-radius:30px;
  padding:11px 21px;
  font-size:12px;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:9999;
  box-shadow:var(--shadow-lift);
}

.toast.show{
  opacity:1;
  transform:translateX(50%) translateY(0);
}

/* =========================
   PRINT
========================= */

#printArea{
  display:none;
}

@media print{
  @page{
    margin:14mm 12mm;
  }

  body *{
    visibility:hidden!important;
  }

  #printArea,
  #printArea *{
    visibility:visible!important;
  }

  #printArea{
    display:block!important;
    position:absolute;
    right:0;
    top:0;
    width:100%;
    padding:0;
    background:#fff;
    font-family:'Cairo',sans-serif;
    color:#1b2420;
  }

  .print-brand-bar{
    height:6px;
    background:linear-gradient(90deg,#0e6b3d,#1b2420 85%);
    border-radius:3px;
    margin-bottom:14px;
  }

  .print-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:2px solid #1b2420;
    padding-bottom:14px;
    margin-bottom:20px;
  }

  .print-header img{
    height:52px;
    border-radius:10px;
    border:1px solid #e2e2e2;
  }

  .print-header .ph-brand{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .print-header h1{
    margin:0;
    font-size:19px;
    letter-spacing:.3px;
  }

  .print-header .ph-meta{
    text-align:left;
    font-size:11px;
    color:#555;
    line-height:1.8;
  }

  .print-docnum{
    display:inline-block;
    background:#1b2420;
    color:#fff;
    border-radius:8px;
    padding:6px 16px;
    font-size:13px;
    font-weight:900;
    margin-bottom:4px;
    letter-spacing:.5px;
  }

  .row2-print{
    display:flex;
    gap:14px;
    margin-bottom:16px;
  }

  .print-party-box{
    flex:1;
    border:1px solid #d8d8d0;
    border-right:4px solid #0e6b3d;
    border-radius:8px;
    padding:12px 14px;
    background:#fafaf6;
  }

  .print-party-title{
    font-size:10px;
    font-weight:900;
    color:#0e6b3d;
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-bottom:6px;
  }

  .print-party-line{
    font-size:12px;
    color:#333;
    line-height:1.7;
  }

  .print-kpis{
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }

  .print-kpi{
    flex:1;
    border:1px solid #d8d8d0;
    border-top:3px solid #0e6b3d;
    border-radius:8px;
    padding:11px 8px;
    text-align:center;
    background:#fafaf6;
  }

  .print-kpi b{
    display:block;
    font-size:15px;
    color:#1b2420;
  }

  .print-kpi span{
    font-size:9.5px;
    color:#777;
    font-weight:700;
  }

  .print-section-title{
    font-size:13px;
    font-weight:900;
    margin:20px 0 8px;
    border-right:4px solid #0e6b3d;
    padding-right:10px;
    color:#1b2420;
  }

  .print-table{
    width:100%;
    border-collapse:collapse;
    margin-top:6px;
    font-size:11px;
  }

  .print-table thead th{
    background:#1b2420;
    color:#fff;
    font-weight:800;
    border:1px solid #1b2420;
    padding:9px 8px;
    text-align:center;
  }

  .print-table td{
    border:1px solid #ddd8c8;
    padding:8px;
    text-align:center;
  }

  .print-table tbody tr:nth-child(even){
    background:#f7f6ef;
  }

  .print-footer{
    margin-top:26px;
    padding-top:10px;
    border-top:1px solid #ccc;
    font-size:9.5px;
    color:#888;
    text-align:center;
  }

  .print-signatures{
    display:flex;
    justify-content:space-between;
    gap:20px;
    margin-top:65px;
  }

  .print-signatures div{
    flex:1;
    text-align:center;
    border-top:1px solid #333;
    padding-top:8px;
    font-size:11px;
    color:#333;
  }

  .print-balance{
    margin-top:18px;
    border:2px solid #1b2420;
    border-radius:10px;
    padding:14px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
    font-weight:900;
    background:#fafaf6;
  }
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){
  .stat-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .header{
    align-items:flex-start;
  }

  .user-area{
    flex-direction:column;
    align-items:flex-end;
  }
}

@media(max-width:560px){
  .app{
    padding:10px 10px 70px;
  }

  .header{
    padding:11px;
    border-radius:16px;
  }

  .brand-logo{
    width:40px;
    height:40px;
  }

  .brand h1{
    font-size:14.5px;
  }

  .brand p{
    font-size:9px;
  }

  .user-badge{
    max-width:130px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .stat-grid{
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .stat{
    padding:12px;
  }

  .stat b{
    font-size:18px;
  }

  .row2,
  .row3{
    grid-template-columns:1fr;
  }

  .item-header,
  .item-row{
    grid-template-columns:1fr 70px 85px 34px;
  }

  .item-header-5,
  .item-row-5{
    grid-template-columns:1fr 46px 62px 62px 32px;
    gap:5px;
  }

  .card{
    padding:15px;
    border-radius:15px;
  }

  .order-top{
    flex-direction:column;
  }

  .flow-step{
    min-width:104px;
  }

  .hbar-label{
    width:88px;
    font-size:10.5px;
  }

  .hbar-val{
    width:64px;
    font-size:10px;
  }
}

    return true;

    console.error("Appwrite init failed:",e);

    return false;

  }

}

function loadFromLocalCache(){

  const raw=
    localStorage.getItem("RASRAS_ERP_DATABASE_V3");

  if(raw){

    try{

      DATA=JSON.parse(raw);

    }catch(e){

      console.error(e);

    }

  }

  ensureDataShape();

  seedDefaultPartiesIfEmpty();

}

async function loadData(){

  cloudOnline=initAppwrite();

  if(cloudOnline){

    try{

      const doc=
        await appwriteDatabases.getDocument(
          APPWRITE_DATABASE_ID,
          APPWRITE_COLLECTION_ID,
          APPWRITE_DOCUMENT_ID
        );

      DATA=JSON.parse(doc.payload||"{}");

      ensureDataShape();

      seedDefaultPartiesIfEmpty();

      /* نسخة احتياطية محلية بعد نجاح السحب من السحابة */
      localStorage.setItem(
        "RASRAS_ERP_DATABASE_V3",
        JSON.stringify(DATA)
      );

    }catch(e){

      const notFound=
        e && (e.code===404 || (e.message||"").indexOf("could not be found")!==-1);

      if(notFound){

        /* أول مرة - المستند لسه مش موجود، هننشئه */
        loadFromLocalCache();

        try{

          await appwriteDatabases.createDocument(
            APPWRITE_DATABASE_ID,
            APPWRITE_COLLECTION_ID,
            APPWRITE_DOCUMENT_ID,
            { payload: JSON.stringify(DATA) }
          );

        }catch(createErr){

          console.error("Appwrite create failed:",createErr);

          cloudOnline=false;

        }

      }else{

        console.error("Appwrite load failed:",e);

        cloudOnline=false;

        loadFromLocalCache();

      }

    }

  }else{

    loadFromLocalCache();

  }

  render();

  if(cloudOnline){

    startCloudPolling();

  }

}

function saveData(){

  DATA.usersConfig=USERS;

  /* حفظ فوري محلي (نسخة احتياطية سريعة، تشتغل حتى لو النت مقطوع) */
  localStorage.setItem(
    "RASRAS_ERP_DATABASE_V3",
    JSON.stringify(DATA)
  );

  if(cloudOnline){

    pushToCloud();

  }

}

async function pushToCloud(){

  if(!cloudOnline || !appwriteDatabases) return;

  cloudSavePending=true;

  try{

    await appwriteDatabases.updateDocument(
      APPWRITE_DATABASE_ID,
      APPWRITE_COLLECTION_ID,
      APPWRITE_DOCUMENT_ID,
      { payload: JSON.stringify(DATA) }
    );

    cloudSavePending=false;

  }catch(e){

    console.error("Appwrite save failed:",e);

    cloudSavePending=false;

    showToast("⚠️ تعذر حفظ آخر تعديل على السحابة، هيتحفظ محليًا بس دلوقتي");

  }

}

function startCloudPolling(){

  if(cloudSyncTimer) return;

  cloudSyncTimer=setInterval(pullFromCloudQuietly,25000);

}

async function pullFromCloudQuietly(){

  if(!cloudOnline || !appwriteDatabases) return;

  /* من غير ما نقطع حد وهو بيدخل بيانات في فورم */
  if(state.draft || state.settlementDraft) return;

  if(cloudSavePending) return;

  try{

    const doc=
      await appwriteDatabases.getDocument(
        APPWRITE_DATABASE_ID,
        APPWRITE_COLLECTION_ID,
        APPWRITE_DOCUMENT_ID
      );

    const fresh=
      doc.payload||"";

    const current=
      JSON.stringify(DATA);

    if(fresh===current) return;

    DATA=JSON.parse(doc.payload||"{}");

    ensureDataShape();

    localStorage.setItem(
      "RASRAS_ERP_DATABASE_V3",
      JSON.stringify(DATA)
    );

    if(currentUser) render();

  }catch(e){

    console.error("Appwrite poll failed:",e);

  }

}

function manualRefresh(){

  if(!cloudOnline){

    showToast("مفيش اتصال بالسحابة حاليًا، البيانات محلية بس");

    return;

  }

  showToast("جاري تحديث البيانات...");

  pullFromCloudQuietly().then(()=>{

    showToast("تم التحديث");

  });

}

/* =========================================================
   BACKUP / RESTORE
========================================================= */

function downloadBackup(){

  DATA.usersConfig=USERS;

  const json=
    JSON.stringify(DATA,null,2);

  const blob=
    new Blob([json],{type:"application/json"});

  const url=
    URL.createObjectURL(blob);

  const now=new Date();

  const stamp=
    now.getFullYear()+"-"+
    String(now.getMonth()+1).padStart(2,"0")+"-"+
    String(now.getDate()).padStart(2,"0")+"_"+
    String(now.getHours()).padStart(2,"0")+"-"+
    String(now.getMinutes()).padStart(2,"0");

  const a=
    document.createElement("a");

  a.href=url;

  a.download="RASRAS_backup_"+stamp+".json";

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  URL.revokeObjectURL(url);

  showToast("تم تنزيل النسخة الاحتياطية");

}

function restoreBackup(){

  const input=
    document.getElementById("restoreFileInput");

  if(!input || !input.files || !input.files.length){

    showToast("اختار ملف النسخة الاحتياطية الأول");

    return;

  }

  const file=input.files[0];

  const reader=new FileReader();

  reader.onload=function(e){

    let parsed;

    try{

      parsed=JSON.parse(e.target.result);

    }catch(err){

      showToast("الملف ده مش JSON صحيح");

      return;

    }

    if(!parsed || typeof parsed!=="object" || !Array.isArray(parsed.orders)){

      showToast("شكل الملف مش متوافق مع نسخة RASRAS الاحتياطية");

      return;

    }

    if(
      !confirm(
        "متأكد؟ الاستعادة هتمسح كل البيانات الحالية وتستبدلها بالملف ده. الإجراء ده لا يمكن التراجع عنه."
      )
    ) return;

    DATA=parsed;

    ensureDataShape();

    if(DATA.usersConfig){

      USERS=DATA.usersConfig;

    }

    saveData();

    showToast("تم استعادة النسخة الاحتياطية بنجاح");

    render();

  };

  reader.readAsText(file);

}

/* =========================================================
   HELPERS
========================================================= */

function uid(prefix){

  return prefix+"-"+Date.now()+"-"+Math.floor(
    100+Math.random()*900
  );

}

function todayISO(){

  return new Date().toISOString();

}

function fmtDate(date){

  if(!date) return "—";

  return new Date(date).toLocaleDateString(
    "ar-EG",
    {
      year:"numeric",
      month:"short",
      day:"numeric"
    }
  );

}

function fmtDateTime(date){

  if(!date) return "—";

  return new Date(date).toLocaleString(
    "ar-EG",
    {
      year:"numeric",
      month:"short",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

function fmtMoney(n){

  return Number(n||0).toLocaleString(
    "ar-EG",
    {
      maximumFractionDigits:2
    }
  )+" ج.م";

}

function itemsTotal(order){

  return (order.items||[]).reduce(
    (sum,item)=>
      sum+
      (Number(item.qty)||0)*
      (Number(item.price)||0),
    0
  );

}

function orderTotal(order){

  if(
    order.finalTotal !== undefined &&
    order.finalTotal !== null &&
    order.finalTotal !== ""
  ){
    return Number(order.finalTotal)||0;
  }

  return itemsTotal(order)+(Number(order.shippingCost)||0);

}

/* =========================
   EXTERNAL ORDER COST / PROFIT
   (أوامر خارجية: مورد -> عميل مباشرة)
========================= */

function itemsCost(order){

  return (order.items||[]).reduce(
    (sum,item)=>
      sum+
      (Number(item.qty)||0)*
      (Number(item.costPrice)||0),
    0
  );

}

function externalProfit(order){

  return itemsTotal(order)-itemsCost(order);

}

function getStageLabel(key){

  const specialLabels={
    rejected:"مرفوض",
    cancelled:"ملغي"
  };

  if(specialLabels[key]) return specialLabels[key];

  const s =
    STAGES.find(x=>x.key===key) ||
    PURCHASE_STAGES.find(x=>x.key===key);

  return s ? s.label : key;

}

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent=message;

  toast.classList.add("show");

  setTimeout(
    ()=>toast.classList.remove("show"),
    2400
  );

}

/* =========================================================
   PARTY
========================================================= */

function onPartySelect(select){

  const option=
    select.options[
      select.selectedIndex
    ];

  if(!option || !option.value) return;

  document.getElementById("f_name").value=
    option.value;

  document.getElementById("f_phone").value=
    option.dataset.phone||"";

  document.getElementById("f_address").value=
    option.dataset.address||"";

}

/* =========================================================
   ADD / REMOVE ITEMS
========================================================= */

function addItem(){

  if(!state.draft) return;

  const newItem={
    name:"",
    qty:1,
    price:0
  };

  if(state.draft.type==="external"){

    newItem.costPrice=0;

  }

  state.draft.items.push(newItem);

  render();

}

function rmItem(index){

  if(
    !state.draft ||
    state.draft.items.length<=1
  ) return;

  state.draft.items.splice(index,1);

  render();

}

/* =========================================================
   SUBMIT SALE
========================================================= */

function submitSale(){

  const name=
    document.getElementById("f_name").value.trim();

  const phone=
    document.getElementById("f_phone").value.trim();

  const address=
    document.getElementById("f_address").value.trim();

  const tax=
    document.getElementById("f_tax").value==="1";

  const pay=
    document.getElementById("f_pay").value;

  const collection=
    Number(
      document.getElementById("f_collection").value
    )||0;

  if(!name){

    showToast("أدخل اسم العميل");

    return;

  }

  if(!phone){

    showToast("أدخل تليفون العميل");

    return;

  }

  const items=[];

  document
    .querySelectorAll(".item-row")
    .forEach(row=>{

      const itemName=
        row.querySelector(".it-name")
          .value.trim();

      const qty=
        Number(
          row.querySelector(".it-qty").value
        )||0;

      const price=
        Number(
          row.querySelector(".it-price").value
        )||0;

      if(itemName && qty>0){

        items.push({
          name:itemName,
          qty,
          price
        });

      }

    });

  if(!items.length){

    showToast("أدخل صنف واحد على الأقل");

    return;

  }

  const order=state.draft;

  order.partyName=name;
  order.phone=phone;
  order.address=address;
  order.taxInvoice=tax;
  order.paymentMethod=pay;
  order.expectedCollection=collection;
  order.items=items;

  /*
    مهم:
    أمر البيع يذهب للمدير أولا.
    لا يذهب للنقل مباشرة.
  */

  order.stage="manager_approval";

  order.createdBy=
    currentUser.name;

  order.createdAt=
    todayISO();

  DATA.orders.unshift(order);

  DATA.parties=
    DATA.parties||[];

  const exists=
    DATA.parties.some(
      p=>p.name===name
    );

  if(!exists){

    DATA.parties.push({

      id:uid("P"),

      name,

      phone,

      address,

      type:"عميل"

    });

  }

  DATA.notifications.unshift({

    id:uid("NT"),

    type:"manager_order",

    orderId:order.id,

    title:"أمر بيع جديد يحتاج اعتماد المدير",

    message:
      `تم إنشاء أمر البيع ${order.id} للعميل ${name}`,

    read:false,

    createdAt:todayISO()

  });

  saveData();

  state.draft=null;

  state.view="dashboard";

  showToast(
    "تم حفظ أمر البيع وإرساله للمدير للاعتماد"
  );

  render();

}

function submitExternal(){

  const supplierName=document.getElementById("ex_supplierName").value.trim();
  const supplierPhone=document.getElementById("ex_supplierPhone").value.trim();
  const supplierAddress=document.getElementById("ex_supplierAddress").value.trim();

  const customerName=document.getElementById("ex_customerName").value.trim();
  const customerPhone=document.getElementById("ex_customerPhone").value.trim();
  const customerAddress=document.getElementById("ex_customerAddress").value.trim();

  const pay=document.getElementById("ex_pay").value;
  const tax=document.getElementById("ex_tax").value==="1";

  const creditDaysInput=
    document.getElementById("ex_creditDays");

  const creditDays=
    pay==="آجل" && creditDaysInput
    ?(Number(creditDaysInput.value)||0)
    :0;

  if(!supplierName){
    showToast("أدخل اسم المورد");
    return;
  }

  if(!customerName){
    showToast("أدخل اسم العميل");
    return;
  }

  const items=[];

  document.querySelectorAll(".item-row").forEach(row=>{

    const itemName=row.querySelector(".it-name").value.trim();
    const qty=Number(row.querySelector(".it-qty").value)||0;
    const costPrice=Number(row.querySelector(".it-cost").value)||0;
    const price=Number(row.querySelector(".it-price").value)||0;

    if(itemName && qty>0){
      items.push({ name:itemName, qty, costPrice, price });
    }

  });

  if(!items.length){
    showToast("أدخل صنف واحد على الأقل");
    return;
  }

  const order=state.draft;

  order.supplierName=supplierName;
  order.supplierPhone=supplierPhone;
  order.supplierAddress=supplierAddress;

  order.partyName=customerName;
  order.phone=customerPhone;
  order.address=customerAddress;

  order.paymentMethod=pay;
  order.creditDays=creditDays;
  order.taxInvoice=tax;
  order.items=items;

  /*
    تكلفة النقل بيحددها قسم النقل بعدين،
    مش وقت إنشاء الأمر.
  */

  order.stage="logistics_review";

  order.createdBy=currentUser.name;
  order.createdAt=todayISO();

  DATA.orders.unshift(order);

  DATA.parties=DATA.parties||[];

  if(!DATA.parties.some(p=>p.name===supplierName)){

    DATA.parties.push({
      id:uid("P"),
      name:supplierName,
      phone:supplierPhone,
      address:supplierAddress,
      type:"مورد"
    });

  }

  if(!DATA.parties.some(p=>p.name===customerName)){

    DATA.parties.push({
      id:uid("P"),
      name:customerName,
      phone:customerPhone,
      address:customerAddress,
      type:"عميل"
    });

  }

  DATA.notifications.unshift({
    id:uid("NT"),
    type:"logistics",
    orderId:order.id,
    title:"أمر خارجي جديد يحتاج تحديد تكلفة النقل",
    message:`الأمر الخارجي ${order.id} من ${supplierName} للعميل ${customerName} يحتاج مراجعة النقل`,
    read:false,
    createdAt:todayISO()
  });

  saveData();

  state.draft=null;

  state.view="dashboard";

  showToast(
    "تم حفظ الأمر الخارجي وإرساله لقسم النقل لتحديد تكلفة النقل"
  );

  render();

}

function toggleTripExclude(id){

  if(!state.settlementDraft) return;

  const idx=
    state.settlementDraft.excluded.indexOf(id);

  if(idx===-1){

    state.settlementDraft.excluded.push(id);

  }else{

    state.settlementDraft.excluded.splice(idx,1);

  }

  render();

}

function updateSettlementPaid(value){

  if(!state.settlementDraft) return;

  state.settlementDraft.paid=
    Number(value)||0;

  render();

}

function saveSettlement(){

  if(!state.settlementDraft) return;

  const previousBalance=
    Number(DATA.transportBalance)||0;

  const trips=
    DATA.orders.filter(
      o=>
        Number(o.shippingCost||0)>0 &&
        !o.settled &&
        o.stage!=="cancelled"
    );

  const included=
    trips.filter(
      o=>
        !state.settlementDraft.excluded.includes(o.id)
    );

  if(!included.length && previousBalance===0){

    showToast("لا يوجد رصيد ولا نقلات لتسويتها");

    return;

  }

  const totalOwedThisPeriod=
    included.reduce(
      (s,o)=>s+Number(o.shippingCost||0),
      0
    );

  const grandDue=
    previousBalance+totalOwedThisPeriod;

  const paid=
    Number(state.settlementDraft.paid)||0;

  const newBalance=
    grandDue-paid;

  const settlement={

    id:uid("STL"),

    createdAt:todayISO(),

    createdBy:currentUser.name,

    orderIds:included.map(o=>o.id),

    previousBalance,

    totalOwedThisPeriod,

    grandDue,

    paid,

    newBalance

  };

  included.forEach(o=>{

    o.settled=true;

    o.settlementId=settlement.id;

  });

  DATA.settlements=
    DATA.settlements||[];

  DATA.settlements.unshift(settlement);

  DATA.transportBalance=
    newBalance;

  saveData();

  state.settlementDraft=null;

  showToast(
    newBalance===0
    ?"تم حفظ التسوية وسداد الحساب بالكامل"
    :"تم حفظ التسوية، والباقي هيترحّل للمرة الجاية"
  );

  printSettlement(settlement.id);

  render();

}

/* =========================================================
   FLOW
========================================================= */

function externalStagesFor(order){

  const list=[
    { key:"external_created", label:"تم الإنشاء" },
    { key:"logistics_review", label:"مراجعة النقل" }
  ];

  if(order.taxInvoice){

    list.push({ key:"tax_pending", label:"الفاتورة الضريبية" });

  }

  list.push({ key:"completed", label:"مكتمل" });

  return list;

}

function flowHTML(order){

  const stagesList=
    order.type==="purchase"?
    PURCHASE_STAGES:
    order.type==="external"?
    externalStagesFor(order):
    STAGES;

  const currentIndex=
    stagesList.findIndex(
      x=>x.key===order.stage
    );

  return `

  <div class="flow">

    ${stagesList.map(
      (stage,index)=>`

      <div
        class="flow-step
          ${
            index<currentIndex
            ?"done"
            :
            index===currentIndex
            ?"active"
            :""
          }
        "
      >

        <div class="flow-dot">

          ${
            index<currentIndex
            ?"✓"
            :
            index+1
          }

        </div>

        <div class="flow-label">
          ${stage.label}
        </div>

      </div>

      `
    ).join("")}

  </div>

  `;

}

/* =========================================================
   CANCEL BOX (إلغاء الأمر) — المدير والحسابات فقط
========================================================= */

function cancelBoxHTML(o){

  const canCancel=
    (
      currentUser.role==="admin" ||
      currentUser.role==="accounts"
    ) &&
    o.stage!=="completed" &&
    o.stage!=="cancelled" &&
    o.stage!=="rejected";

  if(o.stage==="cancelled"){

    return `

    <div class="card">

      <div class="alert alert-red" style="margin-bottom:0">
        <b>🚫 الأمر ده اتلغى</b><br>
        بواسطة ${escapeHTML(o.cancelledBy||"")} بتاريخ ${fmtDateTime(o.cancelledAt)}<br>
        السبب: ${escapeHTML(o.cancelReason||"—")}
      </div>

    </div>

    `;

  }

  if(!canCancel) return "";

  return `

  <div class="card">

    <div class="card-title">
      <div>
        <h3>إلغاء الأمر</h3>
        <p>متاح للمدير والحسابات فقط، ولا يمكن التراجع عنه</p>
      </div>
    </div>

    <button
      class="btn-danger"
      style="width:100%"
      onclick="cancelOrder('${o.id}')"
    >
      🚫 إلغاء هذا الأمر
    </button>

  </div>

  `;

}

function cancelOrder(id){

  if(
    currentUser.role!=="admin" &&
    currentUser.role!=="accounts"
  ){

    showToast("الإلغاء متاح للمدير والحسابات فقط");

    return;

  }

  const o=
    DATA.orders.find(
      x=>x.id===id
    );

  if(!o) return;

  if(
    o.stage==="completed" ||
    o.stage==="cancelled" ||
    o.stage==="rejected"
  ){

    showToast("الأمر ده مكتمل أو ملغي بالفعل");

    return;

  }

  const reason=
    prompt(
      "سبب إلغاء الأمر:",
      ""
    );

  if(reason===null) return;

  if(
    !confirm(
      "متأكد إنك عايز تلغي الأمر "+o.id+"؟ الإجراء ده مش هينفع تتراجع فيه."
    )
  ) return;

  o.stageBeforeCancel=o.stage;

  o.stage="cancelled";

  o.cancelledAt=todayISO();

  o.cancelledBy=currentUser.name;

  o.cancelReason=
    reason||"بدون سبب محدد";

  DATA.notifications.unshift({

    id:uid("NT"),

    type:"cancelled",

    orderId:o.id,

    title:"🚫 تم إلغاء الأمر",

    message:
      `تم إلغاء ${o.id} بواسطة ${currentUser.name}. السبب: ${o.cancelReason}`,

    read:false,

    createdAt:todayISO()

  });

  saveData();

  showToast("تم إلغاء الأمر");

  render();

}

function normalizeEgyptPhone(phone){

  let p=
    String(phone||"")
      .replace(/\D/g,"");

  if(p.startsWith("01")){

    p="20"+p.substring(1);

  }

  if(p.startsWith("0020")){

    p=p.substring(2);

  }

  return p;

}

function sendDriverWhatsApp(id){

  const o=
    DATA.orders.find(
      x=>x.id===id
    );

  if(!o || !o.driverPhone){

    showToast(
      "رقم السائق غير موجود"
    );

    return;

  }

  const phone=
    normalizeEgyptPhone(
      o.driverPhone
    );

  const message=
    o.driverMessage ||
    buildDriverMessage(o);

  const url=
    "https://wa.me/"+
    phone+
    "?text="+
    encodeURIComponent(message);

  window.open(
    url,
    "_blank"
  );

}

function copyDriverMessage(id){

  const o=
    DATA.orders.find(
      x=>x.id===id
    );

  if(!o) return;

  const message=
    o.driverMessage ||
    buildDriverMessage(o);

  if(
    navigator.clipboard &&

  ){

    navigator.clipboard
      .writeText(message)
      .then(
        ()=>showToast(
          "تم نسخ رسالة السائق"
        )
      );

  }else{

    showToast(
      "انسخ الرسالة يدوياً"
    );

  }

}

function monthlySeries(sales,months,valueFn){

  months = months||6;

  valueFn = valueFn||orderTotal;

  const now = new Date();

  const buckets=[];

  for(let i=months-1;i>=0;i--){

    const d=
      new Date(now.getFullYear(),now.getMonth()-i,1);

    buckets.push({

      key: d.getFullYear()+"-"+d.getMonth(),

      label: d.toLocaleDateString("ar-EG",{month:"short"}),

      total:0,

      count:0

    });

  }

  sales.forEach(o=>{

    const d = new Date(o.createdAt);

    const key = d.getFullYear()+"-"+d.getMonth();

    const bucket = buckets.find(b=>b.key===key);

    if(bucket){

      bucket.total += valueFn(o);
      bucket.count += 1;

    }

  });

  return buckets;

}

function stageBreakdown(sales){

  const colorMap={

    manager_approval:"var(--plum)",
    logistics_review:"var(--amber)",
    accounts_approval:"var(--steel)",
    warehouse_release:"var(--rose)",
    with_driver:"var(--amber)",
    delivered:"var(--pine)",
    tax_pending:"var(--clay)",
    completed:"var(--pine)",
    rejected:"var(--clay)",
    warehouse_receipt:"var(--rose)",
    accounts_settlement:"var(--steel)"

  };

  const counts={};

  sales.forEach(o=>{

    counts[o.stage]=(counts[o.stage]||0)+1;

  });

  return Object.keys(counts)

    .map(key=>({

      key,

      label:getStageLabel(key),

      count:counts[key],

      color:colorMap[key]||"var(--muted)"

    }))

    .sort((a,b)=>b.count-a.count);

}

function topCustomers(sales,limit){

  limit = limit||5;

  const map={};

  sales.forEach(o=>{

    if(!map[o.partyName]){

      map[o.partyName]={

        name:o.partyName,

        total:0,

        count:0

      };

    }

    map[o.partyName].total += orderTotal(o);
    map[o.partyName].count += 1;

  });

  return Object.values(map)

    .sort((a,b)=>b.total-a.total)

    .slice(0,limit);

}

/* =========================
   EXTERNAL ORDERS REPORT SECTION
   (أوامر خارجية - مورد → عميل مباشرة - المدير/الحسابات فقط)
========================= */

function externalReportSectionHTML(externalOrders){

  if(!externalOrders.length) return "";

  const activeExternal=
    externalOrders.filter(
      o=>o.stage!=="cancelled" && o.stage!=="rejected"
    );

  const cancelledCount=
    externalOrders.filter(o=>o.stage==="cancelled").length;

  const saleTotal=
    activeExternal.reduce((s,o)=>s+itemsTotal(o),0);

  const costTotal=
    activeExternal.reduce((s,o)=>s+itemsCost(o),0);

  const profitTotal=
    saleTotal-costTotal;

  const trend=
    monthlySeries(activeExternal,6,o=>externalProfit(o));

  const maxTrend=
    Math.max(1,...trend.map(t=>Math.abs(t.total)));

  return `

  <div class="card">
    <div class="card-title">
      <h2>تقرير الأوامر الخارجية</h2>
    </div>
    <div class="alert alert-blue" style="margin-bottom:0">
      أوامر بيع وشراء خارجية تنتقل من المورد للعميل مباشرة، من غير ما تعدي على المخازن.
      الهامش هنا سري ومتاح للمدير والحسابات فقط. الأرقام هنا بدون الأوامر الملغاة.
    </div>
  </div>

  <div class="stat-grid">

    <div class="stat">
      <div class="stat-icon">${ICONS.money}</div>
      <b>${fmtMoney(saleTotal)}</b>
      <span>إجمالي مبيعات الأوامر الخارجية</span>

function saveParty(){

      .getElementById("p_name")
      .value.trim();

      .getElementById("p_phone")
      .value.trim();

  const type=
    document
      .getElementById("p_type")

      .getElementById("p_address")
      .value.trim();

  if(!name){

  showToast(
    "تم حفظ العميل"

function roleLabel(role){

  const labels={

    sales:"المبيعات",

    logistics:"النقل",

    accounts:"الحسابات",

    warehouse:"المخازن",

    driver:"السائق",

    admin:"مدير النظام"

  };

  return labels[role]||role;

}

function saveUser(){

  const key=
    document
      .getElementById("u_key")
      .value.trim();

  const name=
    document
      .getElementById("u_name")
      .value.trim();

  const pass=
    document
      .getElementById("u_pass")
      .value.trim();

  const role=
    document
      .getElementById("u_role")
      .value;

  if(!key||!name||!pass){

    showToast(
      "أكمل البيانات المطلوبة"
    );

    return;

  }

  let stage=null;

  if(role==="logistics")
    stage="logistics_review";

  if(role==="accounts")
    stage="accounts_approval";

  if(role==="warehouse")
    stage="warehouse_release";

  if(role==="driver")
    stage="with_driver";

  USERS[key]={

    pass,

    name,

    role,

    stage

  };

  saveData();

  showToast(
    "تم حفظ المستخدم"
  );

  render();

}

function deleteUser(key){

  if(
    !confirm(
      "هل تريد حذف هذا المستخدم؟"
    )
  ) return;

  delete USERS[key];

  saveData();

  showToast(
    "تم حذف المستخدم"
  );

  render();

}

/* =========================================================
   APP EVENTS
========================================================= */

function bindAppEvents(){

  const logout=
    document.getElementById(
      "logoutBtn"
    );

  if(logout){

    logout.onclick=()=>{

      currentUser=null;

      state={
        view:"dashboard",
        orderType:"sale",
        selectedOrderId:null,
        draft:null,
        settlementDraft:null
      };

      render();

    };

  }

  document
    .querySelectorAll(".tab")
    .forEach(tab=>{

      tab.onclick=()=>{

        state.view=
          tab.dataset.v;

        if(
          state.view!=="new_sale"
        ){

          state.draft=null;

        }

        if(
          state.view!=="logistics_settlement"
        ){

          state.settlementDraft=null;

        }

        render();

      };

    });

}

/* =========================================================
   OPEN ORDER
========================================================= */

function openOrder(id){

  state.selectedOrderId=id;

  state.view="detail";

  render();

}

function goDashboard(){

  state.view="dashboard";

  state.selectedOrderId=null;

  render();

}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escapeAttr(value){

  return escapeHTML(value);

}
